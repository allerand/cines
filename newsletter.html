<!DOCTYPE html>
<html lang="es">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G1XHLBZZY6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-G1XHLBZZY6');
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter - Si te digo</title>
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="apple-touch-icon" href="favicon.png?v=3">

  <!-- sitedigo.com/newsletter: el encabezado y las pestañas son los de
       index.html (mismos colores y medidas), para que pasar de una pestaña a
       otra no mueva nada. Si cambia el header allá, cambiarlo acá. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root {
      --bg:        #0a0a0a;
      --bg3:       #1a1a1a;
      --border:    #2a2a2a;
      --text:      #e0e0e0;
      --muted:     #666;
      --accent:    #00d060;
      --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    html { font-size: 14px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    header { border-bottom: 1px solid var(--border); padding: 0.35rem 2rem; }
    .header-left { display: flex; align-items: center; }
    .home-link { display: block; line-height: 0; }
    .logo-img { height: 85px; width: auto; display: block; }
    .header-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      margin-left: 8px;
    }
    header h1 { font-size: 1.15rem; font-weight: 600; line-height: 1; letter-spacing: 0.02em; }
    header .subtitle { font-size: 0.85rem; line-height: 1; color: var(--muted); }
    .insta-link {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      line-height: 1;
      color: var(--accent);
      text-decoration: none;
    }

    .secciones {
      display: flex;
      gap: 1.6rem;
      padding: 0 2rem;
      border-bottom: 1px solid var(--border);
    }
    .seccion-link {
      padding: 0.6rem 0 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .seccion-link:hover { color: var(--text); }
    .seccion-link:focus { outline: none; }
    .seccion-link:focus-visible { outline: 1px dotted var(--muted); outline-offset: 3px; }
    .seccion-link.activa { color: var(--text); border-bottom-color: var(--text); }

    main { padding: 2.4rem 2rem; max-width: 34rem; }
    main h2 { font-size: 1.15rem; font-weight: 600; line-height: 1.3; }
    main p { margin-top: 0.6rem; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    .nl-form { display: flex; gap: 0.5rem; margin-top: 1.4rem; }
    .nl-input {
      flex: 1 1 auto;
      min-width: 0;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 0.8rem;
      border-radius: 3px;
      /* 16px: con menos, el iPhone hace zoom al tocar el recuadro. */
      font-size: 16px;
      font-family: inherit;
      transition: border-color 0.12s;
    }
    .nl-input::placeholder { color: var(--muted); }
    .nl-input:focus { outline: none; border-color: var(--accent); }
    .nl-btn {
      flex: 0 0 auto;
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #000;
      padding: 0.6rem 1.1rem;
      border-radius: 3px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    .nl-btn:disabled { opacity: 0.5; cursor: default; }
    .nl-btn:focus-visible { outline: 1px dotted var(--text); outline-offset: 3px; }
    /* Para los bots que llenan todo lo que encuentran: una persona no lo ve. */
    .nl-web { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    main p.nl-msg { min-height: 1.4rem; margin-top: 0.9rem; font-size: 0.9rem; }
    main p.nl-msg.ok { color: var(--accent); }
    main p.nl-msg.error { color: #e06060; }

    @media (max-width: 768px) {
      header { padding: 0.6rem 1rem; }
      .secciones { padding: 0 1rem; }
      main { padding: 1.6rem 1rem; }
    }
    @media (max-width: 480px) {
      .nl-form { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="./" class="home-link" title="Volver al inicio" aria-label="Volver al inicio"><img src="logo.png" alt="Si te digo" class="logo-img"></a>
    <div class="header-text">
      <h1>Si te digo</h1>
      <span class="subtitle">Cartelera de cines - Buenos Aires</span>
      <a href="https://www.instagram.com/sitedigocine/" target="_blank" rel="noopener" class="insta-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        <span>@sitedigocine</span>
      </a>
    </div>
  </div>
</header>

<nav class="secciones" aria-label="Secciones">
  <a class="seccion-link" href="./#buenos-aires">Cartelera</a>
  <a class="seccion-link" href="./#festivales">Festivales</a>
  <a class="seccion-link activa" href="newsletter" aria-current="page">Newsletter</a>
</nav>

<main>
  <h2>¿Querés recibir el newsletter de Si te digo?</h2>
  <p>Dejá tu mail para recibirlo.</p>
  <form class="nl-form" id="nl-form" novalidate>
    <input type="email" id="nl-email" class="nl-input" name="email" placeholder="tu mail" autocomplete="email" inputmode="email" aria-label="Tu mail" required>
    <input type="text" id="nl-web" class="nl-web" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="nl-btn" id="nl-btn">Anotarme</button>
  </form>
  <p class="nl-msg" id="nl-msg" role="status" aria-live="polite"></p>
</main>

<script>
// El mismo web app de Apps Script que usa index.html (scripts/newsletter.gs):
// action=newsletter anota el mail en la hoja "newsletter" de la planilla.
// ⚠️ Si cambia STAR_ENDPOINT en index.html, cambiarlo acá también.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbw3wbhTtknasBwkgky4ogkM6s3Gt1K1I7giZdyX5KhvMIKUIsATNQL8VT6pPLG9mjAs/exec';

// El identificador anónimo de index.html, para poder cruzar con las otras hojas.
function deviceId() {
  try {
    let id = localStorage.getItem('sd:uid');
    if (!id) {
      id = (crypto && crypto.randomUUID ? crypto.randomUUID()
           : 'u-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem('sd:uid', id);
    }
    return id;
  } catch (_) { return 'anon'; }
}

const form = document.getElementById('nl-form');
const input = document.getElementById('nl-email');
const btn = document.getElementById('nl-btn');
const msg = document.getElementById('nl-msg');

function decir(texto, clase) {
  msg.textContent = texto;
  msg.className = 'nl-msg' + (clase ? ' ' + clase : '');
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const email = input.value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    decir('Revisá el mail, no parece completo.', 'error');
    input.focus();
    return;
  }
  // Un bot que llenó el campo escondido: se le dice que sí y no se manda nada.
  if (document.getElementById('nl-web').value) { decir('Listo, anotamos tu mail.', 'ok'); return; }

  btn.disabled = true;
  decir('Anotando…');
  try {
    const body = new URLSearchParams({ action: 'newsletter', email, uid: deviceId() });
    const res = await fetch(ENDPOINT, { method: 'POST', body });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'error');
    decir('Listo, anotamos tu mail.', 'ok');
    form.hidden = true;
    try { gtag('event', 'newsletter_alta'); } catch (_) {}
  } catch (_) {
    decir('No se pudo anotar. Probá de nuevo en un rato.', 'error');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
