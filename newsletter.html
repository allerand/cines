<!DOCTYPE html>
<html lang="es">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G1XHLBZZY6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-G1XHLBZZY6');
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter - Si te digo</title>
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="apple-touch-icon" href="favicon.png?v=3">

  <!-- sitedigo.com/newsletter: el encabezado y las pestañas son los de
       index.html (mismos colores y medidas), para que pasar de una pestaña a
       otra no mueva nada. Si cambia el header allá, cambiarlo acá. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root {
      --bg:        #0a0a0a;
      --bg3:       #1a1a1a;
      --border:    #2a2a2a;
      --text:      #e0e0e0;
      --muted:     #666;
      --accent:    #00d060;
      --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    html { font-size: 14px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    header { border-bottom: 1px solid var(--border); padding: 0.35rem 2rem; }
    .header-left { display: flex; align-items: center; }
    .home-link { display: block; line-height: 0; }
    .logo-img { height: 85px; width: auto; display: block; }
    .header-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      margin-left: 8px;
    }
    header h1 { font-size: 1.15rem; font-weight: 600; line-height: 1; letter-spacing: 0.02em; }
    header .subtitle { font-size: 0.85rem; line-height: 1; color: var(--muted); }
    .insta-link {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      line-height: 1;
      color: var(--accent);
      text-decoration: none;
    }

    .secciones {
      display: flex;
      gap: 1.6rem;
      padding: 0 2rem;
      border-bottom: 1px solid var(--border);
    }
    .seccion-link {
      padding: 0.6rem 0 0.55rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .seccion-link:hover { color: var(--text); }
    .seccion-link:focus { outline: none; }
    .seccion-link:focus-visible { outline: 1px dotted var(--muted); outline-offset: 3px; }
    .seccion-link.activa { color: var(--text); border-bottom-color: var(--text); }
    .seccion-n {
      display: inline-block;
      margin-left: 0.4rem;
      padding: 0 0.35rem;
      border-radius: 2px;
      background: var(--accent);
      color: #000;
      font-size: 0.65rem;
      letter-spacing: 0;
      vertical-align: 1px;
    }

    /* El formulario habla el idioma del tablero de días de la portada:
       casilleros cuadrados pegados, letra monoespaciada, y el verde como
       borde y letras (el día elegido), no como botón relleno. */
    main { padding: 2.6rem 2rem; max-width: 46rem; }
    main h2 { font-size: 1.7rem; font-weight: 600; line-height: 1.25; letter-spacing: 0.01em; }
    main p { margin-top: 0.7rem; color: #999; font-size: 1.15rem; line-height: 1.5; }
    .nl-form {
      display: flex;
      margin-top: 1.5rem;
      max-width: 34rem;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    .nl-input, .nl-btn {
      height: 58px;
      border: 1px solid var(--border);
      border-radius: 0;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .nl-input {
      position: relative;
      flex: 1 1 auto;
      min-width: 0;
      background: transparent;
      color: var(--text);
      padding: 0 1rem;
      /* 16px como mínimo: con menos, el iPhone hace zoom al tocar el recuadro. */
      font-size: 1.2rem;
      -webkit-appearance: none;
      appearance: none;
    }
    .nl-input::placeholder { color: var(--muted); }
    .nl-input:hover { border-color: #555; z-index: 1; }
    .nl-input:focus { outline: none; border-color: var(--accent); z-index: 2; }
    .nl-btn {
      position: relative;
      flex: 0 0 auto;
      margin-left: -1px;
      background: var(--bg3);
      color: var(--text);
      padding: 0 1.4rem;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    .nl-btn:hover, .nl-btn:focus-visible {
      outline: none;
      border-color: var(--accent);
      color: var(--accent);
      z-index: 2;
    }
    .nl-btn:disabled { color: var(--muted); border-color: var(--border); cursor: default; }
    /* Para los bots que llenan todo lo que encuentran: una persona no lo ve. */
    .nl-web { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    main p.nl-msg { min-height: 1.6rem; margin-top: 1rem; font-size: 1.05rem; }
    main p.nl-msg.ok { color: var(--accent); }
    main p.nl-msg.error { color: #e06060; }

    @media (max-width: 768px) {
      header { padding: 0.6rem 1rem; }
      .secciones { padding: 0 1rem; }
      main { padding: 1.8rem 1rem; }
      main h2 { font-size: 1.45rem; }
      main p { font-size: 1.05rem; }
      .nl-input, .nl-btn { height: 50px; }
      .nl-input { font-size: 16px; padding: 0 0.8rem; }
      .nl-btn { padding: 0 1rem; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="./" class="home-link" title="Volver al inicio" aria-label="Volver al inicio"><img src="logo.png" alt="Si te digo" class="logo-img"></a>
    <div class="header-text">
      <h1>Si te digo</h1>
      <span class="subtitle">Cartelera de cines - Buenos Aires</span>
      <a href="https://www.instagram.com/sitedigocine/" target="_blank" rel="noopener" class="insta-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        <span>@sitedigocine</span>
      </a>
    </div>
  </div>
</header>

<nav class="secciones" aria-label="Secciones">
  <a class="seccion-link" href="./#buenos-aires">Cartelera</a>
  <a class="seccion-link" href="./#festivales">Festivales<span class="seccion-n" id="festivales-n" hidden></span></a>
  <a class="seccion-link activa" href="newsletter" aria-current="page">Newsletter</a>
</nav>

<main>
  <h2>¿Querés recibir el newsletter de Si te digo?</h2>
  <p>Dejá tu mail para recibirlo:</p>
  <form class="nl-form" id="nl-form" novalidate>
    <input type="email" id="nl-email" class="nl-input" name="email" placeholder="tu mail" autocomplete="email" inputmode="email" aria-label="Tu mail" required>
    <input type="text" id="nl-web" class="nl-web" name="web" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" class="nl-btn" id="nl-btn">Anotarme</button>
  </form>
  <p class="nl-msg" id="nl-msg" role="status" aria-live="polite"></p>
</main>

<script>
// El mismo web app de Apps Script que usa index.html (scripts/newsletter.gs):
// action=newsletter anota el mail en la hoja "newsletter" de la planilla.
// ⚠️ Si cambia STAR_ENDPOINT en index.html, cambiarlo acá también.
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbw3wbhTtknasBwkgky4ogkM6s3Gt1K1I7giZdyX5KhvMIKUIsATNQL8VT6pPLG9mjAs/exec';

// El identificador anónimo de index.html, para poder cruzar con las otras hojas.
function deviceId() {
  try {
    let id = localStorage.getItem('sd:uid');
    if (!id) {
      id = (crypto && crypto.randomUUID ? crypto.randomUUID()
           : 'u-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem('sd:uid', id);
    }
    return id;
  } catch (_) { return 'anon'; }
}

// ── El número de festivales en curso, en la pestaña ────────────────────
// La portada lo deja anotado cada vez que lo calcula (sd:fest-n). Si la nota
// es de hoy se usa esa; si no (entraron directo acá, o es de otro día) se
// hace la misma cuenta que actualizarContadorFestivales en index.html: los
// de Buenos Aires por sus funciones en la cartelera, los de afuera por las
// fechas del registro. Si cambia la cuenta allá, cambiarla acá.
function hoyISO() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
}

function mostrarContadorFestivales(n) {
  const el = document.getElementById('festivales-n');
  el.textContent = n;
  el.hidden = !n;
}

async function contarFestivales() {
  const baja = url => fetch(url + '?t=' + Date.now()).then(r => (r.ok ? r.json() : {}));
  const [reg, cart] = await Promise.all([baja('data/festivales.json'), baja('data/cartelera.json')]);
  const registro = (reg.festivales || []).filter(f => f.slug && f.nombre);
  const funciones = cart.screenings || [];
  const busquedaDe = f => (f.ciclo || '').trim().toLowerCase();
  const coincide = (s, q) => [s.title_es, s.title_en, s.original_title, s.director, s.ciclo]
    .join(' ').toLowerCase().includes(q);

  // Los del registro, más los ciclos que dicen "Festival" y no están en él.
  const lista = registro.slice();
  const sueltos = new Set();
  for (const s of funciones) {
    if (!s.ciclo) continue;
    const ciclo = s.ciclo.toLowerCase();
    if (registro.some(f => !f.archivo && busquedaDe(f) && ciclo.includes(busquedaDe(f)))) continue;
    if (/\bfestival\b/i.test(s.ciclo) && !sueltos.has(ciclo)) {
      sueltos.add(ciclo);
      lista.push({ ciclo: s.ciclo });
    }
  }

  const hoy = hoyISO();
  return lista.filter(f => {
    const q = busquedaDe(f);
    const fechas = f.archivo || !q ? []
      : funciones.filter(s => coincide(s, q)).map(s => s.fecha).filter(Boolean).sort();
    const desde = f.desde || fechas[0] || '';
    const hasta = f.hasta || fechas[fechas.length - 1] || '';
    return !(hasta && hasta < hoy) && !!desde && desde <= hoy;
  }).length;
}

(async () => {
  try {
    const nota = JSON.parse(localStorage.getItem('sd:fest-n') || 'null');
    if (nota && nota.dia === hoyISO()) { mostrarContadorFestivales(nota.n); return; }
  } catch (_) {}
  try { mostrarContadorFestivales(await contarFestivales()); } catch (_) {}
})();

const form = document.getElementById('nl-form');
const input = document.getElementById('nl-email');
const btn = document.getElementById('nl-btn');
const msg = document.getElementById('nl-msg');

function decir(texto, clase) {
  msg.textContent = texto;
  msg.className = 'nl-msg' + (clase ? ' ' + clase : '');
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const email = input.value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    decir('Revisá el mail, no parece completo.', 'error');
    input.focus();
    return;
  }
  // Un bot que llenó el campo escondido: se le dice que sí y no se manda nada.
  if (document.getElementById('nl-web').value) { decir('Listo, anotamos tu mail.', 'ok'); return; }

  btn.disabled = true;
  decir('Anotando…');
  try {
    const body = new URLSearchParams({ action: 'newsletter', email, uid: deviceId() });
    const res = await fetch(ENDPOINT, { method: 'POST', body });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'error');
    decir('Listo, anotamos tu mail.', 'ok');
    form.hidden = true;
    try { gtag('event', 'newsletter_alta'); } catch (_) {}
  } catch (_) {
    decir('No se pudo anotar. Probá de nuevo en un rato.', 'error');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
