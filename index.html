  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Si te digo</title>
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="apple-touch-icon" href="favicon.png?v=3">
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0a;
      --bg2:       #111;
      --bg3:       #1a1a1a;
      --border:    #2a2a2a;
      --text:      #e0e0e0;
      --muted:     #666;
      --accent:    #00d060;
      --accent2:   #00a04a;
      --hover-row: #161616;
      --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    html { font-size: 14px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 2rem;
    }

    .header-main-content {
      display: flex;
      justify-content: space-between;
      /* Centrado vertical absoluto para que ambos lados coincidan en el eje medio */
      align-items: center; 
      width: 100%;
    }

    .header-left {
      display: flex;
      align-items: center; 
      gap: 0; /* Controlamos el espacio vía margin-left en .header-text */
    }
    /* Bloque contenedor de las 3 líneas */
    .header-text {
      display: flex;
      flex-direction: column;
      justify-content: center; /* Centrado vertical respecto al logo */
      gap: 3px;               /* Distancia uniforme entre líneas */
      margin-left: 10px;      /* Pegado al logo como pediste */
    }
    .insta-link-mobile { display: none; }
    .insta-link-desktop { display: flex; align-items: center; color: var(--muted); transition: color 0.2s; }
    .insta-link-desktop:hover, .insta-link-mobile:hover { color: var(--accent); }
    
    /* Ajuste del logo para que el bloque de texto quede centrado a su altura */
    .logo-img {
      height: 85px;
      width: auto;
      display: block;
      margin: 0;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1;         /* Reset de altura de línea para simetría */
      margin: 0;
      letter-spacing: 0.02em;
      color: var(--text);
    }

    header .subtitle {
      font-size: 0.85rem;
      line-height: 1;         /* Reset de altura de línea para simetría */
      margin: 0;
      color: var(--muted);
      white-space: nowrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .updated-badge {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      margin: 0;
      /* Esto asegura que el texto se sienta centrado respecto a su propia altura */
      line-height: 1; 
      display: flex;
      align-items: center;
    }
    /* ── Responsive Header ── */
      @media (max-width: 768px) {
        .header-main-content {
          /* En mobile mantenemos el centrado horizontal para que no "baile" arriba o abajo */
          align-items: center;
          flex-direction: row; 
        }
      }

      .header-text {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 4px; /* Este gap controla la separación igualitaria de las 3 líneas */
        margin-left: 8px;
      }

      .insta-link-desktop { display: none; }
      .insta-link-mobile {
        display: flex; 
        align-items: center; 
        gap: 0.4rem; 
        font-size: 0.85rem;
        line-height: 1;         /* Reset de altura de línea para simetría */
        margin: 0;
        color: var(--accent);
        text-decoration: none;
      }
      .header-right {
        width: 100%;
        justify-content: space-between;
        flex-direction: row-reverse;
      }

      .updated-badge {
          font-size: 0.65rem;
        }

      /* En mobile el badge "Actualizado" baja a su propia línea (alineado a la
         derecha) para no pisar el subtítulo del header. */
      @media (max-width: 768px) {
        .header-main-content { flex-wrap: wrap; }
        .header-left { flex: 1 1 auto; min-width: 0; }
        header .subtitle { white-space: normal; }
        .header-right {
          width: 100%;
          flex-direction: row;
          justify-content: flex-end;
          margin-top: 4px;
        }
      }

/* ── Day tabs ── */
    .day-tabs-wrap {
      border-bottom: 1px solid var(--border);
      overflow-x: auto;      /* Permite el scroll horizontal */
      overflow-y: hidden;    /* Bloquea cualquier movimiento vertical raro */
      width: 100%;           /* No deja que el contenedor sea más ancho que la pantalla */
      display: block;
      -webkit-overflow-scrolling: touch; /* Scroll suave en iOS */
      scrollbar-width: none;
    }
    .day-tabs-wrap::-webkit-scrollbar { display: none; }

    .day-tabs {
      display: flex;
      padding: 0 1.5rem;
      gap: 0;
      width: max-content;    /* El contenido interior sí puede ser ancho */
    }

    .day-tab {
      position: relative;
      flex-shrink: 0;        /* IMPORTANTE: Evita que los días se achiquen */
      padding: 0.85rem 1.2rem;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s, opacity 0.15s;
      white-space: nowrap;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      min-width: 80px;
    }
    .day-tab .day-name {
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .day-tab .day-date { font-size: 0.75rem; }
    .day-tab .day-count { font-size: 0.68rem; color: var(--muted); }
    .day-tab:hover { color: var(--text); }
    .day-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .day-tab.active .day-count { color: var(--accent2); }
    .day-tab.today .day-name::before {
      content: "•";
      color: var(--accent);
      margin-right: 0.25rem;
    }
    /* Resaltado de días con funciones para la sala seleccionada.
       Cuando hay un cine filtrado (#day-tabs.cine-filter), los días con
       función para esa sala se marcan con un punto verde y quedan brillantes;
       el resto se atenúa. */
    .day-tabs.cine-filter .day-tab:not(.has-cine) { opacity: 0.32; }
    .day-tabs.cine-filter .day-tab.has-cine { color: var(--text); }
    .day-tab.has-cine::after {
      content: "";
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ── Filters bar ── */
    .filters {
      padding: 0.8rem 2rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }
    /* Los chips de cine viven en su propio bloque flexible; así envuelven
       prolijamente y el buscador queda fijo arriba a la derecha (sin dejar a
       "Borges" / "+ Comerciales" colgados con un hueco enorme al lado). */
    .filter-btns {
      flex: 1 1 300px;
      display: flex;
      gap: 0.6rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-right: 0.3rem;
    }
    .filter-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.3rem 0.7rem;
      border-radius: 3px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.12s;
    }
    .filter-btn:hover { color: var(--text); border-color: #444; }
    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 600;
    }
    /* Toggle "+ Comerciales" — visualmente distinto a los filtros de cine */
    .filter-toggle {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--muted);
      padding: 0.3rem 0.75rem;
      border-radius: 3px;
      font-size: 0.72rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-family: inherit;
      transition: all 0.12s;
      margin-left: 0.4rem;
    }
    .filter-toggle:hover {
      color: var(--text);
      border-color: var(--text);
      border-style: solid;
    }
    .filter-toggle[aria-pressed="true"] {
      background: var(--bg3);
      color: var(--accent);
      border-color: var(--accent);
      border-style: solid;
    }
    /* Chips de cines comerciales — mismos estilos que .filter-btn pero
       con borde punteado para que se vean visualmente "agregados" */
    .filter-btn.commercial-chip {
      border-style: dashed;
      opacity: 0.85;
    }
    .filter-btn.commercial-chip.active {
      border-style: solid;
      opacity: 1;
    }
    .search-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.3rem 0.7rem;
      border-radius: 3px;
      font-size: 0.78rem;
      font-family: inherit;
      flex: 0 0 auto;
      align-self: flex-start;
      width: 15rem;
      transition: border-color 0.12s;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    /* Botón compartir — sólo ícono, copia el deep link con el estado actual
       (día/cine/búsqueda). Desktop: copia directo + globito "Link copiado".
       Mobile (touch): share sheet nativo. */
    .share-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--muted);
      height: 1.85rem;
      padding: 0 0.6rem;
      border-radius: 3px;
      font-size: 0.72rem;
      font-family: inherit;
      cursor: pointer;
      flex: 0 0 auto;
      align-self: flex-start;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .share-btn:hover { color: var(--text); border-color: #444; }
    .share-btn.copied { color: var(--accent); border-color: var(--accent); }
    .share-btn .icon-check { display: none; }
    .share-btn.copied .icon-share { display: none; }
    .share-btn.copied .icon-check { display: block; }
    /* Globito de confirmación — aparece debajo del botón al copiar */
    .share-toast {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      background: var(--bg3);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.28rem 0.55rem;
      border-radius: 3px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
      z-index: 20;
    }
    .share-btn.copied .share-toast { opacity: 1; }

    /* ── Footer de contacto ── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem 2rem;
      margin-top: 1rem;
    }
    .contact-line {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0;
    }
    .contact-line a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .contact-line a:hover { text-decoration: underline; }

    /* ── Main content ── */
    main { padding: 1.5rem 2rem; }

    .screening-table {
      width: 100%;
      /* separate (no collapse) para que los th sticky no tengan el bug de
         doble-render/fantasma en Safari iOS. Las líneas entre filas se
         mantienen vía border-bottom de cada celda. */
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.83rem;
    }
    .screening-table th {
      text-align: left;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 0.5rem 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: color 0.12s;
      /* Encabezados pegajosos: quedan arriba al scrollear sin perder la referencia.
         Usamos box-shadow en vez de border-bottom porque con border-collapse el
         borde se pierde al hacer sticky. */
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--bg);
      box-shadow: inset 0 -1px 0 var(--border);
    }
    .screening-table th:hover { color: var(--text); }
    .screening-table th.sort-active { color: var(--accent); }
    .screening-table th .sort-ind {
      display: inline-block;
      margin-left: 0.25rem;
      color: var(--accent);
      font-size: 0.7rem;
    }
    .screening-table td {
      padding: 0.65rem 0.8rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .screening-table tr:last-child td { border-bottom: none; }
    .screening-table tbody tr:hover td { background: var(--hover-row); }

    .col-hora   { width: 5rem; }
    .col-cine   { width: 11rem; }
    .col-film   { }
    .col-ciclo  { width: 10rem; color: var(--muted); }
    .col-dir    { width: 12rem; color: var(--muted); }
    .col-genre  { width: 8rem; color: var(--muted); }
    .col-pais   { width: 7rem; color: var(--muted); }
    .col-anio   { width: 4rem; color: var(--muted); text-align: right; }
    .col-dur    { width: 4.5rem; color: var(--muted); text-align: right; }
    .col-lb     { width: 7rem; text-align: center; }
    .col-add    { width: 4rem; text-align: center; }
    th.col-add  { line-height: 0; text-align: center; }
    .cal-icon   { vertical-align: middle; color: var(--muted); }
    th.col-add:hover .cal-icon { color: var(--text); }
    .lb-short   { display: none; }

    /* Botón "Agendar en Google Calendar" — entre Cine y Película. NO desplaza
       el título, vive en su propia columna estrecha. */
    .add-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0.18rem 0.4rem;
      line-height: 1;
      border-radius: 3px;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-family: inherit;
      font-variant-numeric: tabular-nums;
    }
    .add-btn:hover { color: var(--text); border-color: var(--text); }
    .add-btn.starred {
      background: rgba(0, 208, 96, 0.08);
      color: var(--accent);
      border-color: var(--accent);
    }
    .add-btn .add-icon { font-weight: 700; }
    .add-btn .add-count { font-size: 0.7rem; opacity: 0.85; }

    .hora-tag {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text);
    }
    .hora-tag.unknown { color: var(--muted); font-weight: 400; font-size: 0.78rem; }
    /* Fecha por fila en modo búsqueda (resultados de varios días). */
    .hora-date {
      display: block;
      font-size: 0.66rem;
      color: var(--accent);
      text-transform: capitalize;
      margin-bottom: 0.1rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .cine-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }
    .cine-tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.18rem 0.5rem;
      border-radius: 2px;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }
    .cine-addr {
      font-size: 0.62rem;
      color: var(--muted);
      opacity: 0.7;
      line-height: 1.25;
      letter-spacing: 0.01em;
      padding-left: 1px;
      white-space: nowrap;
    }
    .cine-malba    { border-color: #2a3a4a; color: #6aaecc; }
    .cine-lugones  { border-color: #3a2a1a; color: #cc8844; }
    .cine-soffici  { border-color: #1c2740; color: #5f8fe0; }
    .cine-cacode   { border-color: #1a2a1a; color: #66bb66; }
    .cine-lorca    { border-color: #1a1a30; color: #7a88cc; }
    .cine-york     { border-color: #2a2a1a; color: #bbbb44; }
    .cine-munro    { border-color: #1a3a3a; color: #66bbbb; }
    .cine-lumiton  { border-color: #3a1a1a; color: #cc6666; }
    .cine-cosmos   { border-color: #3a3a1a; color: #ccbb44; }
    .cine-gaumont  { border-color: #2e1a20; color: #cc5580; }
    .cine-cck      { border-color: #2a2a3a; color: #8888cc; }
    .cine-arthaus  { border-color: #1f3a2f; color: #66cc99; }
    .cine-museo    { border-color: #3a2a1f; color: #d9a066; }
    .cine-ccr      { border-color: #2a1f2f; color: #b07acc; }
    .cine-amorina  { border-color: #3a1f2a; color: #cc6688; }
    .cine-cea      { border-color: #1f3a3a; color: #5fd0c0; }
    .cine-filo     { border-color: #2f2a3a; color: #9988cc; }
    .cine-bn       { border-color: #30331f; color: #b3c46a; }
    .cine-cc25     { border-color: #2d2640; color: #a585e0; }
    .cine-ccd      { border-color: #33231f; color: #d98a66; }
    .cine-cb       { border-color: #3a2433; color: #d976b0; }
    .cine-borges   { border-color: #1f3340; color: #5fb0d0; }
    .cine-bcn      { border-color: #153331; color: #3fbfae; }
    .cine-trilce   { border-color: #3a2a18; color: #d6a05a; }
    .cine-agn      { border-color: #3a2019; color: #e2764a; }
    .cine-mnba     { border-color: #1d3340; color: #6fb3d2; }
    .cine-lucida   { border-color: #2b2340; color: #9d8ae8; }
    /* Comerciales — paleta gris/azulada para diferenciarlos visualmente */
    .cine-cinemark { border-color: #2a2a2a; color: #aaa; }
    .cine-hoyts    { border-color: #2a2a2a; color: #aaa; }
    .cine-cinepolis{ border-color: #2a2a2a; color: #aaa; }
    .cine-showcase { border-color: #2a2a2a; color: #aaa; }
    .cine-multiplex{ border-color: #2a2a2a; color: #aaa; }

    .film-title { font-weight: 500; color: var(--text); }
    /* Título alternativo (criterio Letterboxd): el otro idioma en «guillemets»,
       inline junto al título principal — sin columna ni línea extra. */
    .film-alt-title {
      font-weight: 400;
      font-style: italic;
      font-size: 0.82em;
      color: var(--muted);
      margin-left: 0.3rem;
    }
    .film-meta-row { margin-top: 0.25rem; }
    .film-meta-inline {
      display: none;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.18rem;
      line-height: 1.35;
    }
    .ticket-link {
      font-size: 0.7rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .ticket-link:hover { text-decoration: underline; }
    .ciclo-tag { display: inline-block; font-size: 0.7rem; color: var(--muted); font-style: italic; }
    /* Ciclo dentro de la celda de película — sólo visible en mobile (en desktop
       está la columna Ciclo). */
    .film-ciclo-inline {
      display: none;
      font-size: 0.72rem;
      color: var(--muted);
      font-style: italic;
      margin-top: 0.18rem;
      line-height: 1.35;
    }

    .lb-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.55rem;
      border-radius: 4px;
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .lb-link:hover { background: var(--accent); border-color: var(--accent); color: #000; }
    .lb-link:hover .lb-dots span { opacity: 1; }
    .lb-link.no-link { opacity: 0.18; pointer-events: none; }
    .lb-dots { display: inline-flex; gap: 2px; align-items: center; }
    .lb-dots span { display: block; width: 6px; height: 6px; border-radius: 50%; }
    .lb-dots span:nth-child(1) { background: #ef8232; }
    .lb-dots span:nth-child(2) { background: #00d060; }
    .lb-dots span:nth-child(3) { background: #40bcf4; }

    .empty { padding: 3rem 0; text-align: center; color: var(--muted); font-size: 0.85rem; }

    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 100;
    }
    #loading.hidden { display: none; }
    .spinner {
      width: 2rem; height: 2rem;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--muted); font-size: 0.8rem; }

    @media (max-width: 768px) {

<script>
const DAYS_ES = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const MONTHS_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

// Direcciones físicas de cada sala — se renderiza chica debajo del badge del cine.
// Para chains comerciales (Cinemark/Hoyts/etc.) el lookup matchea por nombre exacto
// (ej. "Cinemark Caballito") porque cada sucursal tiene su propia dirección.
const CINE_ADDRESSES = {
  'Hasta Trilce':             'Maza 177',
  'MALBA':                    'Av. Figueroa Alcorta 3415',
  'Sala Lugones':             'Av. Corrientes 1530',
  'Sala Mario Soffici':       'Vera 559 (DAC)',
  'Cacodelphia':              'Av. Corrientes 1372',
  'Cine Lorca':               'Av. Corrientes 1428',
  'Cine York':                'Alberdi 895, Olivos',
  'Centro Cultural Munro':    'Av. Mitre 1755, Munro',
  'Lumiton':                  'Italia 65, Munro',
  'Cine Cosmos':              'Av. Corrientes 2046',
  'Cine Gaumont':             'Av. Rivadavia 1635',
  'CCK':                      'Sarmiento 151',
  'Arthaus':                  'Bartolomé Mitre 434',
  'Museo del Cine':           'Agustín R. Caffarena 51',
  'Centro Cultural Recoleta': 'Junín 1930',
  'Amorina':                  'Triunvirato 5184',
  'CEA':                       'Colón 1133, Avellaneda',
  'Filo Cine':                'Puan 480',
  'Biblioteca Nacional':      'Agüero 2502',
  'Centro Cultural 25 de Mayo': 'Av. Triunvirato 4444',
  'Centro Cultural de la Cooperación': 'Av. Corrientes 1543',
  'Casa del Bicentenario':    'Riobamba 985',
  'Centro Cultural Borges':   'Viamonte 525',
  'Biblioteca del Congreso':  'Alsina 1835',
  'Archivo General de la Nación': 'Rondeau 2277',
  'Bellas Artes':             'Av. Figueroa Alcorta 2270',
  'Sala Lúcida':              'Av. Cabildo 4740',
  // Comerciales — una entrada por sucursal
  'Cinemark Caballito':       'Av. La Plata 96',
  'Cinemark Palermo':         'Beruti 3399',
  'Cinemark Puerto Madero':   'A. Moreau de Justo 1920',
  'Hoyts Abasto':             'Av. Corrientes 3247',
  'Hoyts Dot':                'Vedia 3626',
  'Cinépolis Houssay':        'M. T. de Alvear 2261',
  'Cinépolis Recoleta':       'Vicente López 2050',
  'Showcase Belgrano':        'Av. Cabildo 1900',
  'Multiplex Belgrano':       'Vuelta de Obligado 2199',
  'Multiplex Lavalle':        'Lavalle 780',
  'Multiplex Canning':        'Formosa 653, Ezeiza',
  'Multiplex Pilar':          'Las Magnolias 754, Pilar',
};

// Cadenas comerciales. Cada peli viene como "Cinemark Caballito",
// "Hoyts Abasto", etc. — matcheamos por PREFIJO así una sola entrada
// cubre todas las sucursales de la cadena.
const COMMERCIAL_PREFIXES = ['Cinemark', 'Hoyts', 'Cinépolis', 'Cinepolis', 'Showcase', 'Multiplex'];
function isCommercial(cine) {
  return COMMERCIAL_PREFIXES.some(p => cine && cine.startsWith(p));
}

let allScreenings = [];
let activeDay = null;
// Salas seleccionadas. Set vacío = "Todos": no guardamos 'all' adentro para no
// tener dos formas de decir lo mismo. Clickear una sala ya elegida la saca.
let activeCines = new Set();
let searchQuery = '';

// ¿Esta función entra en la selección actual? Sin selección entra todo.
// Los chips comerciales (data-cine="Cinemark") matchean por PREFIJO, así un
// solo chip cubre todas las sucursales de la cadena; el resto matchea exacto.
function matchesCine(s) {
  if (!activeCines.size) return true;
  for (const c of activeCines) {
    if (isCommercial(c) ? (s.cine && s.cine.startsWith(c)) : s.cine === c) return true;
  }
  return false;
}

// El chip "Todos" se prende solo cuando no hay ninguna sala elegida.
function syncCineButtons() {
  document.querySelectorAll('.filter-btn').forEach(b => {
    const c = b.dataset.cine;
    b.classList.toggle('active', c === 'all' ? !activeCines.size : activeCines.has(c));
  });
}

// Para los eventos de analítica y para el texto de compartir.
function cinesLabel(sep) {
  return activeCines.size ? [...activeCines].join(sep || '|') : 'all';
}
// Ordenamiento de la tabla. Default: por hora ascendente.
let sortKey = 'hora';
let sortDir = 'asc';

// ── Deep links: el estado (día / cine / búsqueda) vive en el hash ──────
// Formato: #sab-25-jul/gaumont/q=nolan — cada segmento es opcional y el
// orden no importa. Los slugs de cine salen del label del chip ("Gaumont",
// "El Recoleta") para que las URLs queden legibles y compartibles.
// Con varias salas elegidas va un segmento por sala: #sab-25-jul/lorca/cosmos.
function slugify(t) {
  return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

function daySlug(fecha) {
  const [y, m, d] = fecha.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${slugify(DAYS_ES[dt.getDay()])}-${d}-${slugify(MONTHS_ES[m - 1])}`;
}

function cineSlug(cine) {
  const btn = document.querySelector(`.filter-btn[data-cine="${CSS.escape(cine)}"]`);
  return slugify(btn ? btn.textContent : cine);
}

function findCineBySlug(slug) {
  for (const b of document.querySelectorAll('.filter-btn[data-cine]')) {
    const c = b.dataset.cine;
    if (!c || c === 'all') continue;
    if (slugify(b.textContent) === slug || slugify(c) === slug) return c;
  }
  return null;
}

// Última URL que escribimos nosotros — para ignorar el hashchange propio.
let lastHashWritten = null;

function updateHash() {
  const parts = [];
  // Con búsqueda activa la tabla junta funciones de TODOS los días, así que
  // el día no aplica y no va en la URL (sería engañoso al compartirla).
  if (activeDay && !searchQuery) parts.push(daySlug(activeDay));
  // Un segmento por sala, en el orden en que se fueron clickeando.
  for (const c of activeCines) parts.push(cineSlug(c));
  if (searchQuery) parts.push('q=' + encodeURIComponent(searchQuery));
  const hash = parts.length ? '#' + parts.join('/') : '';
  if (hash === location.hash) return;
  lastHashWritten = hash;
  // replaceState: no ensucia el historial con cada click de tab/chip
  history.replaceState(null, '', hash || location.pathname + location.search);
}

// Lee el hash y lo vuelca al estado (sin renderizar — el caller decide).
function applyHashState() {
  const raw = location.hash.replace(/^#/, '');
  if (!raw) return;
  const dates = [...new Set(allScreenings.map(s => s.fecha))];
  for (let seg of raw.split('/')) {
    try { seg = decodeURIComponent(seg); } catch (_) {}
    if (!seg) continue;
    if (seg.startsWith('q=')) {
      searchQuery = seg.slice(2).trim().toLowerCase();
      const inp = document.getElementById('search-input');
      if (inp) inp.value = searchQuery;
      continue;
    }
    const slug = seg.toLowerCase();
    const fecha = dates.find(f => daySlug(f) === slug);
    if (fecha) { activeDay = fecha; continue; }
    const cine = findCineBySlug(slug);
    if (cine) {
      activeCines.add(cine);
      // Un link a un cine comercial tiene que mostrarlo aunque el toggle
      // esté apagado en este dispositivo.
      if (isCommercial(cine)) showCommercial = true;
    }
  }
  syncCineButtons();
}

// Soporta editar el hash a mano / navegar con back-forward entre hashes.
window.addEventListener('hashchange', () => {
  if (location.hash === lastHashWritten || !allScreenings.length) return;
  activeDay = null; activeCines.clear(); searchQuery = '';
  const inp = document.getElementById('search-input');
  if (inp) inp.value = '';
  applyHashState();
  applyCommercialToggle();
  renderTable();
});

// ── Analítica ──────────────────────────────────────────────────────────
// Lo que hay que poder demostrar no es tráfico: es cuánta gente sale de acá
// hacia una boletería. Por eso TODOS los eventos de función llevan los mismos
// parámetros — cine, película, ciclo, días de anticipación — y así cualquier
// informe se corta por la dimensión que haga falta sin volver a tocar el
// tracking.
//
// ⚠️ Los parámetros hay que darlos de alta como dimensiones personalizadas en
//    GA4 o llegan igual pero no se pueden ver en ningún informe, que es la
//    forma más común de que un tracking no sirva para nada. Eso lo hace
//    scripts/ga4_setup.gs de una corrida (es idempotente). Si acá se agrega un
//    parámetro nuevo, hay que agregarlo también a la lista de ese script.

// De dónde llegó la visita. Se lee una sola vez: si después navega dentro del
// sitio la URL cambia, pero el origen de la sesión sigue siendo el mismo.
const CANAL_ORIGEN = (() => {
  const p = new URLSearchParams(location.search);
  const m = p.get('utm_medium') || p.get('utm_source');
  if (m) return m.toLowerCase();
  if (document.referrer && !document.referrer.includes(location.host)) {
    try { return new URL(document.referrer).hostname.replace(/^www\./, ''); }
    catch (_) { return 'referido'; }
  }
  return 'directo';
})();

function slugify(t) {
  return (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
}

// Cuántos días falta para la función. Es el dato que dice si la gente reserva
// con tiempo o decide el mismo día, y cambia por completo cuándo conviene
// publicar.
function diasHasta(fecha) {
  try {
    const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    return Math.round((new Date(fecha + 'T00:00:00') - hoy) / 86400000);
  } catch (_) { return -1; }
}

function paramsFuncion(s, extra) {
  return Object.assign({
    cine: s.cine || '',
    pelicula: s.title_es || s.title_en || '',
    ciclo: s.ciclo || '(sin ciclo)',
    fecha_funcion: s.fecha || '',
    dias_anticipacion: diasHasta(s.fecha),
    canal: CANAL_ORIGEN,
  }, extra || {});
}

function track(evento, params) {
  try { if (window.gtag) gtag('event', evento, params || {}); } catch (_) {}
}

// Link a boletería con UTMs. Sirve para los dos lados: nosotros medimos el
// click y el cine ve en SU propio analytics que la visita llegó desde acá —
// que es la prueba concreta de que la cartelera le mueve gente a la sala.
// Se preservan los parámetros que la URL ya tenga (varias boleterías los usan
// para identificar la función).
function ticketUrl(s) {
  const raw = s.ticket_url || '';
  if (!/^https?:/i.test(raw)) return raw;
  try {
    const u = new URL(raw);
    u.searchParams.set('utm_source', 'sitedigo');
    u.searchParams.set('utm_medium', 'cartelera');
    u.searchParams.set('utm_campaign', s.ciclo ? slugify(s.ciclo) : 'cartelera-web');
    u.searchParams.set('utm_content', slugify(s.title_es || s.title_en));
    return u.toString();
  } catch (_) { return raw; }
}

// ── Sistema de estrellas / "agendar en Google Calendar" ────────────────
// URL del web app de Apps Script (scripts/newsletter.gs). Es una sola para
// todo: action=star y action=buscar por POST, ?action=counts por GET.
//
// ⚠️ Cambia cada vez que se crea una implementación NUEVA en Apps Script (el
//    ID va en la URL). Si un día los stars dejan de contarse o la hoja deja de
//    recibir búsquedas, lo primero que hay que mirar es si esta URL sigue viva:
//    un deployment archivado devuelve el 404 de Drive, y como todas las
//    llamadas son fire-and-forget dentro de try/catch, la web no muestra nada
//    roto — simplemente se pierde lo que se manda.
const STAR_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw3wbhTtknasBwkgky4ogkM6s3Gt1K1I7giZdyX5KhvMIKUIsATNQL8VT6pPLG9mjAs/exec';

function filmKey(s) {
  return `${s.cine}|${s.title_es || s.title_en}|${s.fecha}|${s.hora}`;
}

function starredSet() {
  try { return new Set(JSON.parse(localStorage.getItem('sd:starred') || '[]')); }
  catch (_) { return new Set(); }
}

// Contador por función (cine|title|fecha|hora) — desde Apps Script.
// Cada función tiene su propio contador independiente.
let starCounts = {};

async function fetchStarCounts() {
  try {
    const res = await fetch(STAR_ENDPOINT + '?action=counts', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    starCounts = data.counts || {};
  } catch (_) {}
}

function setStarred(key, on) {
  const s = starredSet();
  if (on) s.add(key); else s.delete(key);
  try { localStorage.setItem('sd:starred', JSON.stringify([...s])); } catch (_) {}
}

function gcalUrl(s) {
  // YYYY-MM-DD + HH:MM → start; end = start + duration (o 2h default)
  const [y, m, d] = (s.fecha || '').split('-').map(Number);
  const [hh, mm] = (s.hora || '00:00').split(':').map(Number);
  if (!y || !m || !d || isNaN(hh)) return '';
  const dur = (typeof s.duration === 'number' && s.duration > 0) ? s.duration : 120;
  const start = new Date(y, m - 1, d, hh, mm);
  const end = new Date(start.getTime() + dur * 60000);
  const fmt = (dt) =>
    `${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}T` +
    `${String(dt.getHours()).padStart(2,'0')}${String(dt.getMinutes()).padStart(2,'0')}00`;
  const title = s.title_es || s.title_en || 'Función de cine';
  const details = [
    s.director ? `Dirección: ${s.director}` : '',
    s.year ? `Año: ${s.year}` : '',
    s.country ? `País: ${s.country}` : '',
    s.ciclo ? `Ciclo: ${s.ciclo}` : '',
    s.letterboxd ? `Letterboxd: ${s.letterboxd}` : '',
    s.ticket_url ? `Entradas: ${s.ticket_url}` : '',
    '',
    'Agendado desde sitedigo.com',
  ].filter(Boolean).join('\n');
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: `${title} — ${s.cine || ''}`,
    dates: `${fmt(start)}/${fmt(end)}`,
    details: details,
    location: s.cine || '',
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

// UUID anónimo por dispositivo — para deduplicar votos en el backend.
// Cada persona = +1, incluso si clickea muchas veces.
function deviceId() {
  try {
    let id = localStorage.getItem('sd:uid');
    if (!id) {
      id = (crypto && crypto.randomUUID ? crypto.randomUUID()
           : 'u-' + Math.random().toString(36).slice(2) + Date.now().toString(36));
      localStorage.setItem('sd:uid', id);
    }
    return id;
  } catch (_) { return 'anon'; }
}

function pingStar(s, on) {
  // Fire-and-forget — el contador de popularidad vive en Apps Script.
  try {
    const body = new URLSearchParams({
      action: 'star',
      on: on ? '1' : '0',
      uid: deviceId(),
      key: filmKey(s),
      cine: s.cine || '',
      title: s.title_es || s.title_en || '',
      fecha: s.fecha || '',
      hora: s.hora || '',
    });
    fetch(STAR_ENDPOINT, { method: 'POST', mode: 'no-cors', body });
  } catch (_) {}
}

// Cada búsqueda va también a la hoja de cálculo, además de GA4. No es
// duplicado al pedo: GA4 sirve para tendencias, pero agrupa la cola larga en
// "(other)", retiene 14 meses y no muestra nada anterior al alta de la
// dimensión personalizada. La hoja es el registro crudo, completo y propio —
// y es la que contesta la pregunta que importa: qué buscó la gente que la
// cartelera no tenía.
let ultimaBusquedaLogueada = '';

function pingBusqueda(termino, resultados) {
  try {
    // Si esto es la continuación de lo que ya mandamos ("fra" → "franz"), el
    // backend pisa esa fila en vez de guardar el prefijo suelto.
    const continuacion = ultimaBusquedaLogueada &&
      termino.startsWith(ultimaBusquedaLogueada) ? ultimaBusquedaLogueada : '';
    const body = new URLSearchParams({
      action: 'buscar',
      termino: termino,
      resultados: String(resultados),
      cine: cinesLabel(),
      fecha: activeDay || '',
      canal: CANAL_ORIGEN,
      uid: deviceId(),
      reemplaza: continuacion,
    });
    fetch(STAR_ENDPOINT, { method: 'POST', mode: 'no-cors', body });
    ultimaBusquedaLogueada = termino;
  } catch (_) {}
}

// Extractores por columna — devuelven un valor comparable (string o number).
// Para columnas mixtas usamos un sentinela alto/bajo para los vacíos.
const SORT_EXTRACTORS = {
  hora:     s => s.hora || '99:99',
  cine:     s => (s.cine || '').toLowerCase(),
  title:    s => displayTitle(s).toLowerCase(),
  ciclo:    s => (s.ciclo || '').toLowerCase(),
  director: s => (s.director || '').toLowerCase(),
  genre:    s => (s.genre || '').toLowerCase(),
  country:  s => (s.country || '').toLowerCase(),
  year:     s => Number(s.year) || 0,   // 'Desconocido' → 0, no rompe el orden
  duration: s => s.duration || 0,
  lb:       s => s.letterboxd ? 1 : 0,
};

// Orden cronológico (fecha, luego hora) — usado en modo búsqueda, que junta
// funciones de varios días.
function sortByDateTime(rows) {
  return [...rows].sort((a, b) => {
    if (a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
    const ta = a.hora || '99:99', tb = b.hora || '99:99';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });
}

// "2026-07-09" → "Mié 9 jul" (etiqueta corta para las filas en modo búsqueda).
function fmtShortDate(fecha) {
  const [y, m, d] = fecha.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${DAYS_ES[dt.getDay()]} ${d} ${MONTHS_ES[m - 1]}`;
}

function sortRows(rows) {
  const extract = SORT_EXTRACTORS[sortKey];
  if (!extract) return rows;
  const mult = sortDir === 'desc' ? -1 : 1;
  return [...rows].sort((a, b) => {
    const va = extract(a), vb = extract(b);
    if (va < vb) return -1 * mult;
    if (va > vb) return  1 * mult;
    // Empate → caer a hora ascendente como tie-breaker
    const ta = a.hora || '99:99', tb = b.hora || '99:99';
    return ta < tb ? -1 : ta > tb ? 1 : 0;
  });
}
// Estado del toggle — persiste en localStorage para que el usuario no
// tenga que volver a tocarlo cada visita.
let showCommercial = (() => {
  try { return localStorage.getItem('sd:showCommercial') === '1'; }
  catch (_) { return false; }
})();

function visibleScreenings() {
  // Aplica el filtro global del toggle comerciales. Usado por todo el
  // resto de la UI (tabs por día, conteos, render, etc.).
  if (showCommercial) return allScreenings;
  return allScreenings.filter(s => !isCommercial(s.cine));
}

function applyCommercialToggle() {
  // Mostrar/ocultar los chips de cines comerciales en la barra
  document.querySelectorAll('.commercial-chip').forEach(el => {
    el.hidden = !showCommercial;
  });
  const tgl = document.getElementById('toggle-commercial');
  if (tgl) {
    tgl.setAttribute('aria-pressed', showCommercial ? 'true' : 'false');
    tgl.textContent = showCommercial ? '− Comerciales' : '+ Comerciales';
  }
  // Si había comerciales elegidos y se ocultaron, los sacamos de la selección
  // (las salas no comerciales que estuvieran elegidas se mantienen).
  if (!showCommercial) {
    let saco = false;
    for (const c of [...activeCines]) {
      if (isCommercial(c)) { activeCines.delete(c); saco = true; }
    }
    if (saco) syncCineButtons();
  }
  // Re-buildeamos los tabs (cambian los conteos por día) y re-renderizamos
  if (allScreenings.length) {
    buildDayTabs();
  }
}

async function loadData() {
  try {
    // 1. Traer primero los contadores globales del backend de Google Sheets
    // Usamos 'reload' para obligar al navegador a pedir datos frescos si estás en incógnito
    await fetchStarCounts();

    // 2. Traer la cartelera local
    const res = await fetch('data/cartelera.json?t=' + Date.now());
    const data = await res.json();
    allScreenings = data.screenings || [];

    if (data.updated) {
      const dateObj = new Date(data.updated);
      // Ajuste de 3 horas si el JSON viene en UTC pero necesitas hora local de Argentina
      dateObj.setHours(dateObj.getHours() - 3); 
      
      const updated = dateObj.toLocaleString('es-AR', {
          day: '2-digit',
          month: 'short',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false
        });
      document.getElementById('updated-badge').textContent = 'Actualizado ' + updated;
    }

    applyHashState();                 // Deep link: #dia/cine/q=... → estado inicial
    applyCommercialToggle();          // Sincroniza chips + label del toggle
    buildDayTabs();                   // Arma las pestañas de los días

    // Deep link a una sala sin día explícito: si el día activo no tiene
    // funciones de esa sala, saltamos al primero que sí (como el click en chip).
    // Lo resolvemos sobre los datos y no sobre las clases .has-cine del DOM,
    // que dependen del orden en que corren buildDayTabs/highlightCineDays.
    if (activeCines.size && activeDay) {
      const pool = visibleScreenings().filter(matchesCine);
      if (!pool.some(s => s.fecha === activeDay)) {
        const firstDay = pool.map(s => s.fecha).sort()[0];
        if (firstDay) selectDay(firstDay);
      }
    }
    
    // Ocultar el loader de la pantalla
    document.getElementById('loading').classList.add('hidden');
    
    // 3. Renderizar la tabla (ahora sí, con starCounts ya cargado en memoria)
    renderTable();
  } catch (e) {
    console.error(e);
    document.getElementById('loading').innerHTML = '<p style="color:#c44">Error al cargar datos.</p>';
  }
}
  
function buildDayTabs() {
  const pool = visibleScreenings();
  const dates = [...new Set(pool.map(s => s.fecha).filter(f => /^\d{4}-\d{2}-\d{2}$/.test(f)))].sort();
  const container = document.getElementById('day-tabs');
  container.innerHTML = '';

  // Usamos fecha local (no UTC) para que el "hoy" sea correcto en Argentina (UTC-3)
  const _now = new Date();
  const todayStr = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;

  // Si el día activo ya no existe en el pool filtrado, reseteamos
  if (activeDay && !dates.includes(activeDay)) activeDay = null;

  dates.forEach((fecha, i) => {
    const [y, m, d] = fecha.split('-').map(Number);
    const dateObj = new Date(y, m - 1, d);
    const dayName = DAYS_ES[dateObj.getDay()];
    const monthName = MONTHS_ES[m - 1];
    const count = pool.filter(s => s.fecha === fecha).length;

    const tab = document.createElement('div');
    tab.className = 'day-tab' + (fecha === todayStr ? ' today' : '');
    tab.dataset.fecha = fecha;
    tab.innerHTML = `<span class="day-name">${dayName}</span><span class="day-date">${d} ${monthName}</span><span class="day-count">${count} func.</span>`;
    tab.addEventListener('click', () => selectDay(fecha));
    container.appendChild(tab);
    // Si no había día seleccionado o el seleccionado ya no existe, tomamos
    // el primero del pool (el más temprano disponible).
    if (i === 0 && !activeDay) selectDay(fecha);
    else if (fecha === activeDay) selectDay(fecha); // re-aplica .active
  });

  highlightCineDays();
}

// Marca en la grilla de días los que tienen funciones para las salas
// seleccionadas. Sin ninguna elegida no resalta nada.
function highlightCineDays() {
  const container = document.getElementById('day-tabs');
  const tabs = container.querySelectorAll('.day-tab');
  const pool = visibleScreenings();
  if (!activeCines.size) {
    container.classList.remove('cine-filter');
    tabs.forEach(t => {
      t.classList.remove('has-cine');
      // Restaurar el contador total del día
      const total = pool.filter(s => s.fecha === t.dataset.fecha).length;
      const c = t.querySelector('.day-count');
      if (c) c.textContent = `${total} func.`;
    });
    return;
  }
  container.classList.add('cine-filter');
  tabs.forEach(t => {
    const fecha = t.dataset.fecha;
    const n = pool.filter(s => s.fecha === fecha && matchesCine(s)).length;
    t.classList.toggle('has-cine', n > 0);
    // El contador muestra las funciones de la sala seleccionada
    const c = t.querySelector('.day-count');
    if (c) c.textContent = `${n} func.`;
  });
}

function resetSort() {
  sortKey = 'hora';
  sortDir = 'asc';
}

function selectDay(fecha) {
  activeDay = fecha;
  resetSort();
  document.querySelectorAll('.day-tab').forEach(t => t.classList.toggle('active', t.dataset.fecha === fecha));
  renderTable();
  updateHash();
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  const cine = btn.dataset.cine;
  // Toggle: si la sala ya estaba elegida la sacamos. "Todos" limpia todo.
  if (cine === 'all') activeCines.clear();
  else if (activeCines.has(cine)) activeCines.delete(cine);
  else activeCines.add(cine);
  // Va acá arriba y no al final: más abajo hay un return temprano cuando el
  // día activo no tiene funciones de esas salas, y el filtro se aplicó igual.
  track('filtrar_cine', {
    cine: cinesLabel(),
    cines_elegidos: activeCines.size,
    canal: CANAL_ORIGEN,
  });
  resetSort();
  syncCineButtons();
  highlightCineDays();
  // Si el día seleccionado no tiene funciones para estas salas, saltamos al
  // primer día disponible para que no quede la tabla vacía.
  if (activeCines.size) {
    const firstDay = document.querySelector('.day-tab.has-cine');
    if (firstDay && firstDay.dataset.fecha !== activeDay) {
      selectDay(firstDay.dataset.fecha);
      firstDay.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      return;
    }
  }
  renderTable();
  updateHash();
});

let searchTrackTimer = null;
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  renderTable();
  updateHash();
  // Con debounce y sólo si quedó algo escrito: si no, cada tecla sería un
  // evento y la lista de búsquedas serían prefijos sin sentido.
  clearTimeout(searchTrackTimer);
  searchTrackTimer = setTimeout(() => {
    if (searchQuery.length >= 3) {
      const resultados = visibleScreenings().filter(s =>
        [s.title_es, s.title_en, s.original_title, s.director, s.ciclo]
          .join(' ').toLowerCase().includes(searchQuery)).length;
      track('buscar', { termino: searchQuery, resultados, canal: CANAL_ORIGEN });
      pingBusqueda(searchQuery, resultados);
    }
  }, 1200);
});

// Compartir la vista actual: el hash ya lleva día/cine/búsqueda, así que la
// URL tal cual es el deep link. Mobile → share sheet nativo; desktop → copiar
// al portapapeles con feedback "Copiado ✓".
// Texto humano de la vista actual — es lo que hace que el mensaje de
// WhatsApp/Telegram salga legible en vez de una URL pelada.
function shareText() {
  const parts = ['Cartelera de cines BA'];
  if (activeCines.size) parts.push([...activeCines].join(' + '));
  if (searchQuery) parts.push(`"${searchQuery}"`);
  else if (activeDay) parts.push(fmtShortDate(activeDay));
  return parts.join(' · ');
}

document.getElementById('share-btn').addEventListener('click', async () => {
  const url = location.href;
  const btn = document.getElementById('share-btn');
  track('compartir_busqueda', {
    cine: cinesLabel(), fecha_funcion: activeDay,
    termino: searchQuery || '(sin búsqueda)', canal: CANAL_ORIGEN,
  });
  // Share sheet nativo SOLO en dispositivos touch (teléfono/tablet), donde es
  // el flujo natural. En desktop el popover del sistema es incómodo: copiamos
  // directo al portapapeles con confirmación visible.
  const isTouch = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (isTouch && navigator.share) {
    try { await navigator.share({ title: 'Si te digo', text: shareText(), url }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; /* sin share sheet → copiar */ }
  }
  try {
    await navigator.clipboard.writeText(url);
  } catch (_) {
    // Fallback para contextos sin clipboard API (http, permisos)
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  btn.classList.add('copied');
  setTimeout(() => btn.classList.remove('copied'), 1800);
});

// Toggle "+ Comerciales" — alterna la inclusión de Cinemark/Hoyts/Cinépolis/etc.
document.getElementById('toggle-commercial').addEventListener('click', () => {
  showCommercial = !showCommercial;
  try { localStorage.setItem('sd:showCommercial', showCommercial ? '1' : '0'); } catch (_) {}
  resetSort();
  applyCommercialToggle();
});

function cineCssClass(cine) {
  const map = { 'MALBA':'cine-malba', 'Sala Lugones':'cine-lugones', 'Sala Mario Soffici':'cine-soffici', 'Cacodelphia':'cine-cacode', 'Cine Lorca':'cine-lorca', 'Cine York':'cine-york', 'Centro Cultural Munro':'cine-munro', 'Lumiton':'cine-lumiton', 'Cine Cosmos':'cine-cosmos', 'Cine Gaumont':'cine-gaumont', 'CCK':'cine-cck', 'Arthaus':'cine-arthaus', 'Museo del Cine':'cine-museo', 'Centro Cultural Recoleta':'cine-ccr', 'Amorina':'cine-amorina', 'CEA':'cine-cea', 'Filo Cine':'cine-filo', 'Biblioteca Nacional':'cine-bn', 'Centro Cultural 25 de Mayo':'cine-cc25', 'Centro Cultural de la Cooperación':'cine-ccd', 'Casa del Bicentenario':'cine-cb', 'Centro Cultural Borges':'cine-borges', 'Biblioteca del Congreso':'cine-bcn', 'Hasta Trilce':'cine-trilce', 'Archivo General de la Nación':'cine-agn', 'Bellas Artes':'cine-mnba', 'Sala Lúcida':'cine-lucida' };
  if (map[cine]) return map[cine];
  // Comerciales: matchear por prefijo (ej. "Cinemark Caballito" → cine-cinemark)
  if (cine && cine.startsWith('Cinemark'))  return 'cine-cinemark';
  if (cine && cine.startsWith('Hoyts'))     return 'cine-hoyts';
  if (cine && (cine.startsWith('Cinépolis') || cine.startsWith('Cinepolis'))) return 'cine-cinepolis';
  if (cine && cine.startsWith('Showcase'))  return 'cine-showcase';
  if (cine && cine.startsWith('Multiplex')) return 'cine-multiplex';
  return '';
}

function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// Criterio Letterboxd unificado (invertido): título ORIGINAL como principal,
// y el título en inglés en «guillemets». Si todavía no tenemos original_title
// (títulos sin match en TMDb, funciones preservadas de corridas viejas),
// caemos al título local del cine.
// Excepción: originales en alfabetos no latinos (japonés, chino, coreano,
// cirílico, árabe...) no le dicen nada al público local → mostramos el
// título en español y el inglés queda en las «comillas».
function isNonLatinTitle(t) {
  return /[぀-ヿ㐀-䶿一-鿿豈-﫿가-힯ᄀ-ᇿЀ-ӿ֐-׿؀-ۿ฀-๿ऀ-ॿ]/.test(t);
}

// Países que no escriben en alfabeto latino. Si de uno de ellos llega un
// original en letras latinas, es una TRANSLITERACIÓN ("Hotaru no Haka"), que
// para el público de acá no dice más que el kanji.
const NON_LATIN_COUNTRIES = [
  'japón', 'japon', 'japan', 'china', 'corea', 'korea', 'taiwán', 'taiwan',
  'hong kong', 'tailandia', 'thailand', 'india', 'rusia', 'russia', 'ucrania',
  'israel', 'irán', 'iran', 'grecia', 'greece', 'egipto', 'egypt', 'serbia',
  'bulgaria', 'georgia', 'armenia', 'camboya', 'nepal', 'bangladesh',
];

function isTransliterated(s) {
  const orig = s.original_title || '';
  if (!orig || isNonLatinTitle(orig)) return false;
  const country = (s.country || '').toLowerCase();
  if (!NON_LATIN_COUNTRIES.some(c => country.includes(c))) return false;
  // Si el original coincide con el título en inglés no es transliteración,
  // sino una peli en inglés rodada allá (p.ej. "Lost in Translation").
  const norm = t => t.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  return norm(orig) !== norm(s.title_en || '');
}

// El original va de título principal sólo si se lee acá: quedan afuera los
// alfabetos no latinos y las transliteraciones.
function displayTitle(s) {
  const orig = s.original_title || '';
  if (orig && !isNonLatinTitle(orig) && !isTransliterated(s)) return orig;
  return s.title_es || s.title_en || orig;
}

// "TOM Y JERRY" → "Tom y jerry". Algunos cines devuelven el título en
// mayúsculas y se cuela en title_en.
function normalizeAllCaps(t) {
  if (!t) return '';
  if (t === t.toUpperCase() && t.length > 3) return t.charAt(0) + t.slice(1).toLowerCase();
  return t;
}

function altTitle(s) {
  const main = displayTitle(s);
  const en = normalizeAllCaps(s.title_en || '');
  const norm = t => t.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (!en || norm(en) === norm(main)) return '';
  return en;
}

function renderTable() {
  const main = document.getElementById('main');
  const searching = !!searchQuery;
  // Con búsqueda activa mostramos funciones de TODOS los días (p.ej. todas las
  // pelis de "lucrecia martel" en la ventana). Sin búsqueda: sólo el día activo.
  let rows = visibleScreenings();
  if (!searching) rows = rows.filter(s => s.fecha === activeDay);
  if (activeCines.size) rows = rows.filter(matchesCine);
  if (searching) rows = rows.filter(s => [s.title_es, s.title_en, s.original_title, s.director, s.ciclo].join(' ').toLowerCase().includes(searchQuery));

  rows = searching ? sortByDateTime(rows) : sortRows(rows);

  if (rows.length === 0) {
    main.innerHTML = '<div class="empty">No hay funciones.</div>';
    return;
  }

  const stars = starredSet();
  const tbody = rows.map((s, i) => {
    const horaText = (s.hora === '??' || !s.hora) ? 'S/H' : s.hora;
    const k = filmKey(s);
    const isStarred = stars.has(k);
    // Contador por función — cada (cine|título|fecha|hora) es independiente
    const count = starCounts[k] || 0;
    const countHtml = count > 0 ? `<span class="add-count">${count}</span>` : '';
    const icon = isStarred ? '✓' : '+';
    const addBtn = `<button class="add-btn${isStarred ? ' starred' : ''}" data-row="${i}" title="Agendar en Google Calendar"><span class="add-icon">${icon}</span>${countHtml}</button>`;

    const alt = altTitle(s);
    const filmCell = `<div class="film-title">${escapeHtml(displayTitle(s))}${alt ? `<span class="film-alt-title">«${escapeHtml(alt)}»</span>` : ''}</div>
      ${s.ciclo ? `<div class="film-ciclo-inline">${escapeHtml(s.ciclo)}</div>` : ''}
      <div class="film-meta-inline">${escapeHtml([s.director, s.year, s.duration ? s.duration + ' min' : '', s.country].filter(Boolean).join(' · '))}</div>
      ${s.ticket_url ? `<div class="film-meta-row"><a class="ticket-link" data-row="${i}" href="${escapeHtml(ticketUrl(s))}" target="_blank" rel="noopener">Entradas →</a></div>` : ''}`;

    return `<tr>
      <td class="col-hora">${searching ? `<span class="hora-date">${fmtShortDate(s.fecha)}</span>` : ''}<span class="hora-tag">${horaText}</span></td>
      <td class="col-cine"><div class="cine-cell"><span class="cine-tag ${cineCssClass(s.cine)}">${escapeHtml(s.cine)}</span>${CINE_ADDRESSES[s.cine] ? `<div class="cine-addr">${escapeHtml(CINE_ADDRESSES[s.cine])}</div>` : ''}</div></td>
      <td class="col-add">${addBtn}</td>
      <td class="col-film">${filmCell}</td>
      <td class="col-ciclo">${s.ciclo ? `<span class="ciclo-tag">${escapeHtml(s.ciclo)}</span>` : ''}</td>
      <td class="col-dir">${escapeHtml(s.director || '')}</td>
      <td class="col-genre">${escapeHtml(s.genre || '')}</td>
      <td class="col-pais">${escapeHtml(s.country || '')}</td>
      <td class="col-anio">${s.year || ''}</td>
      <td class="col-dur">${s.duration ? s.duration + ' min' : ''}</td>
      <td class="col-lb"><a class="lb-link ${s.letterboxd ? '' : 'no-link'}" data-row="${i}" href="${s.letterboxd || '#'}" target="_blank" rel="noopener"><span class="lb-dots"><span></span><span></span><span></span></span></a></td>
    </tr>`;
  }).join('');

  const headers = [
    ['hora',     'col-hora', 'Hora'],
    ['cine',     'col-cine', 'Cine'],
    ['__add',    'col-add',  '<svg class="cal-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>'],          // botón "agendar" — no sorteable
    ['title',    'col-film', 'Película'],
    ['ciclo',    'col-ciclo','Ciclo'],
    ['director', 'col-dir',  'Director'],
    ['genre',    'col-genre','Género'],
    ['country',  'col-pais', 'País'],
    ['year',     'col-anio', 'Año'],
    ['duration', 'col-dur',  'Duración'],
    ['lb',       'col-lb',   '<span class="lb-full">Letterboxd</span><span class="lb-short">LB</span>'],
  ];
  const thead = headers.map(([key, cls, label]) => {
    if (key === '__add') return `<th class="${cls}" style="cursor:default">${label}</th>`;
    const isActive = sortKey === key;
    const ind = isActive ? `<span class="sort-ind">${sortDir === 'asc' ? '▲' : '▼'}</span>` : '';
    return `<th class="${cls}${isActive ? ' sort-active' : ''}" data-sort="${key}">${label}${ind}</th>`;
  }).join('');

  main.innerHTML = `<table class="screening-table"><thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody></table>`;

  // Handler de sort por click en header
  main.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (sortKey === k) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = k;
        // Para columnas numéricas (year/duration) o LB, default a desc
        sortDir = (k === 'year' || k === 'duration' || k === 'lb') ? 'desc' : 'asc';
      }
      renderTable();
    });
  });

  // Eventos de salida. `posicion` y `vista` van acá y no en paramsFuncion
  // porque dependen de cómo estaba armada la lista en ese momento: sirven para
  // saber si la gente clickea lo primero que ve o si baja a buscar.
  const vista = searching ? 'busqueda' : 'dia';
  main.querySelectorAll('.ticket-link').forEach(a => {
    a.addEventListener('click', () => {
      const s = rows[parseInt(a.dataset.row, 10)];
      if (s) track('click_entradas', paramsFuncion(s, {
        posicion: parseInt(a.dataset.row, 10) + 1, vista,
      }));
    });
  });
  main.querySelectorAll('.lb-link:not(.no-link)').forEach(a => {
    a.addEventListener('click', () => {
      const s = rows[parseInt(a.dataset.row, 10)];
      if (s) track('click_letterboxd', paramsFuncion(s, { vista }));
    });
  });

  // Handler del botón "Agendar": toggle local + abrir Google Calendar + ping
  // al backend (Apps Script) para el contador de popularidad.
  main.querySelectorAll('.add-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(btn.dataset.row, 10);
      const s = rows[i];
      if (!s) return;
      const k = filmKey(s);
      const wasStarred = btn.classList.contains('starred');
      const nowStarred = !wasStarred;
      setStarred(k, nowStarred);
      // Bump optimista del contador local — el server lo confirma al próximo load
      starCounts[k] = Math.max(0, (starCounts[k] || 0) + (nowStarred ? 1 : -1));
      btn.classList.toggle('starred', nowStarred);
      const count = starCounts[k] || 0;
      const countHtml = count > 0 ? `<span class="add-count">${count}</span>` : '';
      const icon = nowStarred ? '✓' : '+';
      btn.innerHTML = `<span class="add-icon">${icon}</span>${countHtml}`;
      pingStar(s, nowStarred);
      track(nowStarred ? 'agendar_funcion' : 'desagendar_funcion',
            paramsFuncion(s, { vista }));
      if (nowStarred) {
        const url = gcalUrl(s);
        if (url) window.open(url, '_blank', 'noopener');
      }
    });
  });
}

loadData();
</script>
</body>
</html>
