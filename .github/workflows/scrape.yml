name: Scrape cartelera

on:
  schedule:
    # 13:00 UTC = 10:00 Buenos Aires (UTC-3). Corre todos los días.
    - cron: '0 13 * * *'
  workflow_dispatch:  # permite triggear manual desde la UI de GitHub

permissions:
  contents: write  # necesario para commitear data/cartelera.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python3 run.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartelera.json data/cache.json
          git diff --cached --quiet || git commit -m "data: refresh cartelera $(date -u +%Y-%m-%d)"
          git push
