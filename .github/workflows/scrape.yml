name: Scrape cartelera

on:
  schedule:
    # 13:30 UTC = 10:30 Buenos Aires (UTC-3). Corre todos los días.
    - cron: '30 13 * * *'
  workflow_dispatch:  # permite triggear manual desde la UI de GitHub

permissions:
  contents: write  # necesario para commitear data/cartelera.json y posts/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        run: python3 run.py

      - name: Compute today's date (Buenos Aires)
        id: date
        run: echo "today=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate Instagram posts
        run: python3 scripts/generate_posts.py --date "${{ steps.date.outputs.today }}"

      - name: Commit cartelera + posts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartelera.json data/cache.json posts/
          git diff --cached --quiet || git commit -m "data: refresh cartelera + posts $(date -u +%Y-%m-%d)"
          git push

      - name: Post to Instagram
        # Solo si los secrets están seteados (sino, lo saltea sin error)
        if: ${{ secrets.IG_USER_ID != '' && secrets.IG_ACCESS_TOKEN != '' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Las PNGs deben ser accesibles públicamente. Usamos raw.githubusercontent
          # porque está disponible inmediatamente después del push (sin esperar deploy)
          PUBLIC_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main"
        run: |
          # Pequeña espera para que raw.githubusercontent indexe el commit nuevo
          sleep 15
          python3 scripts/post_to_instagram.py --date "${{ steps.date.outputs.today }}"
