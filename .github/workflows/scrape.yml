name: Scrape cartelera

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:  # permite triggear manual desde la UI de GitHub

permissions:
  contents: write  # necesario para commitear data/cartelera.json y posts/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
    
      - name: Sync with main
        run: git pull --ff-only origin main
    
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 run.py

      - name: Compute today's date (Buenos Aires)
        id: date
        run: echo "today=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate Instagram stories (daily)
        run: python3 scripts/generate_posts.py --date "${{ steps.date.outputs.today }}" --format story

      - name: Commit cartelera + posts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartelera.json data/cache.json posts/

          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi

          git commit -m "data: refresh cartelera + posts $(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"

          # Rebase resolviendo conflictos a favor de NUESTRA generación fresca
          # (-X theirs en rebase = mantener el commit que se está aplicando).
          git pull --rebase -X theirs origin main
          git push origin main
          
      - name: Post stories to Instagram (daily)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # raw.githubusercontent sirve las PNGs apenas el commit anterior está pusheado
          PUBLIC_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main"
        run: |
          if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "⏭  IG secrets no seteados — salteando post"
            exit 0
          fi
          # Pequeña espera para que raw.githubusercontent indexe el commit nuevo
          sleep 20
          python3 scripts/post_to_instagram.py --date "${{ steps.date.outputs.today }}" --stories-only
