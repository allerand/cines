name: Scrape cartelera

on:
  schedule:
    # 06:47 UTC = 03:47 ART. El posteo a Instagram ya no cuelga de acá (lo hace
    # post-ig.yml a las 08:08 ART), así que lo único que se le pide a esta hora
    # es llegar con la cartelera y las PNG commiteadas antes de esa. Con las
    # demoras habituales del scheduler de GitHub (30-90 min) y los 20-42 min
    # que tarda el job, termina cerca de las 05:00 ART: tres horas de aire.
    - cron: '47 6 * * *'
  workflow_dispatch:  # permite triggear manual desde la UI de GitHub

permissions:
  contents: write  # necesario para commitear data/cartelera.json y posts/

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
    
      - name: Sync with main
        run: git pull --ff-only origin main
    
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        # `playwright install --with-deps` corre apt-get adentro, y el 19/8/2026
        # apt se colgó bajando los índices de Ubuntu: el paso quedó una hora
        # sin imprimir nada hasta comerse el timeout del job entero. Resultado:
        # ese día no hubo scrape, ni stories generadas, ni post en Instagram.
        # Con timeout por intento + reintentos, un mirror colgado cuesta
        # minutos y no el día.
        timeout-minutes: 20
        run: |
          pip install -r requirements.txt
          ok=0
          for i in 1 2 3; do
            if timeout 300 playwright install --with-deps chromium; then ok=1; break; fi
            echo "::warning::playwright install se colgó o falló (intento $i/3)"
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::playwright install falló 3 veces"; exit 1; }

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Servicio de scraping (IPs residenciales) para saltear el bloqueo de
          # Cloudflare a la IP del runner (opcional). Lo usan Borges y, desde el
          # 14/8/2026, también el CCK: palaciolibertad.gob.ar empezó a contestar
          # el challenge de CF y el cine quedaba en 0 funciones.
          # SCRAPER_KEY es el nombre nuevo; si no está, se usa BORGES_SCRAPER_KEY.
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          SCRAPER_URL_TEMPLATE: ${{ secrets.SCRAPER_URL_TEMPLATE }}
          BORGES_SCRAPER_KEY: ${{ secrets.BORGES_SCRAPER_KEY }}
          BORGES_SCRAPER_URL_TEMPLATE: ${{ secrets.BORGES_SCRAPER_URL_TEMPLATE }}
          # Cacodelphia sale del newsletter semanal que el cine manda por mail:
          # la SPA es mucho más frágil y encima se saltea horarios. Sin esto el
          # scraper cae solo a la SPA, así que no rompe nada, pero la cartelera
          # del cine queda a medias. GMAIL_APP_PASSWORD es una contraseña de
          # aplicación de Google (no la de la cuenta), con 2FA activado.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 run.py

      - name: Compute today's date (Buenos Aires)
        id: date
        run: echo "today=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Generate Instagram stories
        run: |
          python3 scripts/generate_posts.py --date "${{ steps.date.outputs.today }}" --format story

      - name: Commit cartelera + posts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartelera.json data/cache.json data/cck_eventos.json data/ctba_eventos.json posts/

          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi

          git commit -m "data: refresh cartelera + posts $(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"

          # Rebase resolviendo conflictos a favor de NUESTRA generación fresca
          # (-X theirs en rebase = mantener el commit que se está aplicando).
          git pull --rebase -X theirs origin main
          git push origin main
          
      # El posteo a Instagram NO va acá. Vive en post-ig.yml, que corre a las
      # 08:08 ART: acá la hora de publicación quedaba atada a cuánto tardara el
      # scraper y a cuánta cola tuviera el scheduler, y las stories salían a
      # cualquier hora. Si lo volvés a agregar, se postea dos veces por día.
