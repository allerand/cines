name: Auditoría semanal

# Corre scripts/audit.py y deja el informe en data/audit.md + data/audit.html.
# Existe porque los scrapers fallan en silencio: cada uno atrapa su excepción y
# devuelve [], así que un cine puede desaparecer de la web durante semanas sin
# que nada avise. Esto convierte ese silencio en un informe.
#
# Cómo llega el informe:
#   · mail semanal — scripts/audit_mail.gs (Apps Script, proyecto APARTE del
#     newsletter) lee el data/audit.html commiteado acá y lo manda. Sin secrets:
#     corre con la cuenta de Google del dueño y no le escribe a nadie más.
#   · issue — sólo si hay ERRORes, para tener dónde seguir el arreglo.
# Por eso el informe se commitea SIEMPRE, aunque salga limpio: el mail necesita
# leer el de esta semana.

on:
  schedule:
    - cron: '30 12 * * 1'   # lunes 09:30 ART, después del scrape diario
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # La auditoría compara cada cine contra su propio histórico, que sale
          # de los commits de data/cartelera.json. Con el clone shallow por
          # defecto no hay línea de base y se pierde la mitad del valor.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Correr auditoría
        id: audit
        run: |
          set +e
          python3 scripts/audit.py --out data/audit.md --html data/audit.html
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commitear el informe
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit.md data/audit.html
          git diff --staged --quiet || git commit -m "audit: informe $(date -u +%Y-%m-%d)"
          git push

      # Sólo se abre issue si hubo ERRORes (exit 1). Un informe limpio ya viaja
      # por mail y no necesita ruido extra.
      - name: Abrir issue si hay hallazgos
        if: steps.audit.outputs.exit_code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Auditoría de cartelera — $(date -u +%Y-%m-%d)" \
            --body-file data/audit.md \
            --label auditoria || \
          gh issue create \
            --title "Auditoría de cartelera — $(date -u +%Y-%m-%d)" \
            --body-file data/audit.md
