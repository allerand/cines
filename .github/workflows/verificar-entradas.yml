name: Verificar links de entradas

# Corre scripts/verificar_entradas.py desde la red del runner: abre el link de
# entradas de cada función cargada a mano de un festival y confirma que la
# página es la de esa película. Para las que no, sugiere el link bueno.
#
# Existe porque esos links se arman con el título ("Primavera temprana" →
# ficuba.com/es/pelicula/primavera-temprana) y un signo mal adivinado manda a
# una página vacía que nadie revisa: la fila se ve completa.

on:
  workflow_dispatch:
    inputs:
      ciclo:
        description: 'Festival: funciones con ciclo "X" o "X - …" (ej. FICUBA)'
        required: true
      listado:
        description: 'Páginas que linkean las películas, separadas por espacios, para sugerir links (opcional)'
        required: false
      solo:
        description: 'Verificar sólo estos títulos, separados por "|" (opcional)'
        required: false

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar
        env:
          CICLO: ${{ inputs.ciclo }}
          LISTADO: ${{ inputs.listado }}
          SOLO: ${{ inputs.solo }}
        run: |
          args=(--ciclo "$CICLO")
          for l in $LISTADO; do args+=(--listado "$l"); done
          IFS='|' read -ra titulos <<< "$SOLO"
          for t in "${titulos[@]}"; do [ -n "$t" ] && args+=(--solo "$t"); done
          python3 scripts/verificar_entradas.py "${args[@]}"
