name: Test TMDb credential

# TEMPORAL — prestado para correr scripts/probe_acceso.py desde la red del
# runner y averiguar si el 403 de palaciolibertad / Borges / Bicentenario se
# saltea con Chromium. Se restaura al contenido original en el commit
# siguiente.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          for i in 1 2 3; do
            if timeout 300 playwright install --with-deps chromium; then break; fi
            echo "::warning::playwright install falló (intento $i/3)"
            sleep 15
          done

      - name: Sondeo de acceso
        run: python3 scripts/probe_acceso.py
