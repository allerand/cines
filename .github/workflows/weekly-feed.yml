name: Weekly feed (lunes)

# Cada lunes a las 04:15 UTC (= 01:15 BA): scrape, generar las 7 slides
# semanales (portrait) y postear el carrusel al feed de Instagram.
# También se puede disparar manual con workflow_dispatch.

on:
  # Cron deshabilitado por ahora — sólo manual via Run workflow.
  workflow_dispatch:
    inputs:
      monday:
        description: 'Lunes de la semana (YYYY-MM-DD). Vacío = el próximo lunes desde hoy.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (genera + loguea, no postea)'
        type: boolean
        default: false
      skip_scrape:
        description: 'Saltar scraper — usar la cartelera.json del repo'
        type: boolean
        default: false

# Es manual, pero dos "Run workflow" seguidos postearían el carrusel dos veces.
# Esto los serializa; el chequeo contra Instagram de post_to_instagram.py frena
# al segundo cuando ve que la cuenta ya tiene el carrusel de hoy.
concurrency:
  group: weekly-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # Ver el comentario en scrape.yml: apt puede colgarse adentro de
        # `playwright install --with-deps` y comerse el timeout del job.
        timeout-minutes: 20
        run: |
          pip install -r requirements.txt
          ok=0
          for i in 1 2 3; do
            if timeout 300 playwright install --with-deps chromium; then ok=1; break; fi
            echo "::warning::playwright install se colgó o falló (intento $i/3)"
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "::error::playwright install falló 3 veces"; exit 1; }

      - name: Compute Monday's date
        id: monday
        run: |
          if [ -n "${{ inputs.monday }}" ]; then
            d="${{ inputs.monday }}"
          else
            # weekday: Mon=1 (date +%u). Días a sumar para llegar al próximo lunes,
            # o hoy si hoy es lunes.
            today=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)
            dow=$(TZ='America/Argentina/Buenos_Aires' date -d "$today" +%u)
            offset=$(( (8 - dow) % 7 ))
            d=$(date -d "$today +$offset day" +%Y-%m-%d)
          fi
          echo "value=$d" >> "$GITHUB_OUTPUT"
          echo "📅 lunes objetivo: $d"

      - name: Run scraper (full)
        if: ${{ inputs.skip_scrape != true }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python3 run.py

      - name: Skip scrape notice
        if: ${{ inputs.skip_scrape == true }}
        run: echo "⏭  Saltando scraper — usando data/cartelera.json del repo"

      - name: Generate weekly portrait slides
        run: |
          python3 scripts/generate_posts.py \
            --week-start "${{ steps.monday.outputs.value }}" \
            --format portrait

      - name: Commit data + weekly slides
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cartelera.json data/cache.json posts/

          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
          else
            git commit -m "data: weekly refresh + slides for ${{ steps.monday.outputs.value }}"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

      - name: Post weekly feed to Instagram
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main"
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && { [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; }; then
            echo "❌ Faltan secrets IG_USER_ID / IG_ACCESS_TOKEN"
            exit 1
          fi
          sleep 20
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/post_to_instagram.py \
              --week-start "${{ steps.monday.outputs.value }}" --dry-run
          else
            python3 scripts/post_to_instagram.py \
              --week-start "${{ steps.monday.outputs.value }}"
          fi
