name: Scrape cartelera (sin postear a IG)

# Workflow para correr SÓLO el scraper y commitear data/cartelera.json.
# No genera ni postea piezas de Instagram, así que sirve para dos cosas:
#
#   · manual (workflow_dispatch), para testear cambios al scraping sin
#     re-postear stories;
#   · el refresco de la tarde, porque el cine publica programación durante el
#     día y scrape.yml corre a las 4:15 ART. El 6/8/2026 cargaron las 7
#     películas del 8° FINCA y "Amélie y los secretos" después de esa corrida,
#     y quedaron fuera de la web hasta el día siguiente. Este segundo pase las
#     levanta el mismo día; postear queda para el de la mañana.

on:
  schedule:
    - cron: '15 23 * * *'   # 20:15 ART
  workflow_dispatch:
    inputs:
      semanas:
        description: 'Semanas hacia adelante (default 9 ≈ 2 meses)'
        required: false
        default: '9'
      regenerate_stories:
        description: 'Regenerar PNG de stories de hoy (sin postear)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          # Servicio de scraping (IPs residenciales) para saltear el bloqueo de
          # Cloudflare a la IP del runner. Lo usan Borges y, desde el 14/8/2026,
          # el CCK. Opcional: si el secret no está, cada uno intenta directo y,
          # si falla, queda vacío sin romper nada.
          # SCRAPER_KEY es el nombre nuevo; si no está, se usa BORGES_SCRAPER_KEY.
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          SCRAPER_URL_TEMPLATE: ${{ secrets.SCRAPER_URL_TEMPLATE }}
          BORGES_SCRAPER_KEY: ${{ secrets.BORGES_SCRAPER_KEY }}
          BORGES_SCRAPER_URL_TEMPLATE: ${{ secrets.BORGES_SCRAPER_URL_TEMPLATE }}
          # Sin esto Cacodelphia pierde el newsletter y queda sólo con la SPA.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        # Cuando se dispara por schedule, inputs.semanas viene vacío → default 9 (≈ 2 meses)
        run: python3 run.py --semanas "${{ inputs.semanas || '9' }}"

      # `regenerate_stories` es un input de tipo boolean, así que acá vale el
      # booleano y no el string: con `== 'true'` la comparación daba false y
      # estos dos pasos quedaban skipped, dejando los PNG de las stories con la
      # cartelera vieja aunque el scrape hubiera arreglado los datos.
      - name: Compute today's date (Buenos Aires)
        if: ${{ inputs.regenerate_stories == true }}
        id: date
        run: echo "today=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Regenerate today's story PNGs (no posting)
        if: ${{ inputs.regenerate_stories == true }}
        run: python3 scripts/generate_posts.py --date "${{ steps.date.outputs.today }}" --format story

      - name: Commit cartelera (+ optional stories)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cartelera.json data/cache.json
          if [ "${{ inputs.regenerate_stories }}" = "true" ]; then
            git add posts/
          fi

          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi

          git commit -m "data: scrape-only refresh $(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"

          # Rebase resolviendo conflictos a favor de NUESTRA generación fresca
          # de cartelera.json (-X theirs en rebase = mantener el commit que se
          # está aplicando, que somos nosotros).
          git pull --rebase -X theirs origin main
          git push origin main
