name: Scrape cartelera (sin postear a IG)

# Workflow para correr SÓLO el scraper y commitear data/cartelera.json.
# No genera ni postea piezas de Instagram. Sirve para:
#   1) Trigger manual (testeo de cambios al scraping).
#   2) Refrescos automáticos durante el día — CTBA y otros cines pueden
#      agregar eventos después del cron principal de las 4:15 AM (que sí
#      postea a IG). Los refreshes adicionales capturan esas adiciones
#      tardías sin re-postear stories.

on:
  schedule:
    # Refrescos extra durante el día — sin IG post.
    # 13:00 UTC = 10:00 AR (mediodía-ish, captura updates de la mañana)
    # 19:00 UTC = 16:00 AR (media tarde, captura updates del mediodía)
    # 01:00 UTC = 22:00 AR previo (captura updates de la tarde/noche)
    - cron: '0 13 * * *'
    - cron: '0 19 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      semanas:
        description: 'Semanas hacia adelante (default 2)'
        required: false
        default: '2'
      regenerate_stories:
        description: 'Regenerar PNG de stories de hoy (sin postear)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        # Cuando se dispara por schedule, inputs.semanas viene vacío → default 2
        run: python3 run.py --semanas "${{ inputs.semanas || '2' }}"

      - name: Compute today's date (Buenos Aires)
        if: ${{ inputs.regenerate_stories == 'true' }}
        id: date
        run: echo "today=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Regenerate today's story PNGs (no posting)
        if: ${{ inputs.regenerate_stories == 'true' }}
        run: python3 scripts/generate_posts.py --date "${{ steps.date.outputs.today }}" --format story

      - name: Commit cartelera (+ optional stories)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cartelera.json data/cache.json
          if [ "${{ inputs.regenerate_stories }}" = "true" ]; then
            git add posts/
          fi

          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi

          git commit -m "data: scrape-only refresh $(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"

          # Rebase resolviendo conflictos a favor de NUESTRA generación fresca
          # de cartelera.json (-X theirs en rebase = mantener el commit que se
          # está aplicando, que somos nosotros).
          git pull --rebase -X theirs origin main
          git push origin main
