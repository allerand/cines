name: Scrape cartelera (sin postear a IG)

# Workflow para correr SÓLO el scraper y commitear data/cartelera.json.
# No genera ni postea piezas de Instagram. SÓLO manual (workflow_dispatch):
# sirve para testear cambios al scraping sin re-postear stories. El refresco
# diario automático lo hace "Scrape cartelera" (scrape.yml), que ya postea.

on:
  workflow_dispatch:
    inputs:
      semanas:
        description: 'Semanas hacia adelante (default 9 ≈ 2 meses)'
        required: false
        default: '9'
      regenerate_stories:
        description: 'Regenerar PNG de stories de hoy (sin postear)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run scraper
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        # xvfb-run da un display virtual para el navegador HEADFUL de Borges (su
        # sitio bloquea headless con un challenge anti-bots). El resto de scrapers
        # siguen headless. Cuando se dispara por schedule, inputs.semanas viene
        # vacío → default 9 (≈ 2 meses).
        run: xvfb-run -a python3 run.py --semanas "${{ inputs.semanas || '9' }}"

      - name: Compute today's date (Buenos Aires)
        if: ${{ inputs.regenerate_stories == 'true' }}
        id: date
        run: echo "today=$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Regenerate today's story PNGs (no posting)
        if: ${{ inputs.regenerate_stories == 'true' }}
        run: python3 scripts/generate_posts.py --date "${{ steps.date.outputs.today }}" --format story

      - name: Commit cartelera (+ optional stories)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/cartelera.json data/cache.json
          if [ "${{ inputs.regenerate_stories }}" = "true" ]; then
            git add posts/
          fi

          if git diff --cached --quiet; then
            echo "No hay cambios para commitear"
            exit 0
          fi

          git commit -m "data: scrape-only refresh $(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"

          # Rebase resolviendo conflictos a favor de NUESTRA generación fresca
          # de cartelera.json (-X theirs en rebase = mantener el commit que se
          # está aplicando, que somos nosotros).
          git pull --rebase -X theirs origin main
          git push origin main
