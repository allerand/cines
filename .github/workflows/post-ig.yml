name: Post to Instagram

# El posteo diario a Instagram: UNA vez por día, a la mañana.
#
# Vivía adentro de scrape.yml, y ahí la hora del posteo era "cuando el cron
# arranque + lo que tarde el scraper" — entre 20 y 42 minutos según el día.
# Peor: los workflows programados de GitHub arrancan tarde cuando hay cola, y
# no un poco. Con el cron puesto a las 07:15 UTC, el 27/8/2026 la corrida
# arrancó 18:18 y el 31/8 a las 15:08. Las stories salían a cualquier hora.
#
# Separado, la hora del posteo depende del cron y de dos minutos de job, no del
# scraper: el scrape corre de madrugada y deja las PNG commiteadas, y esto sale
# a las 8 de la mañana a publicarlas. Si el scrape se atrasó tanto que todavía
# no hay slides de hoy —o quedaron viejas frente a la cartelera—, este workflow
# las genera él mismo antes de postear, así un scheduler con cola no se lleva
# puesto el posteo del día.
#
# Es el ÚNICO lugar que postea las stories diarias. Si volvés a agregar el paso
# en scrape.yml, se postea dos veces por día.
#
# NO SE POSTEA DOS VECES — tres candados, y cada uno tapa el agujero del
# anterior. El 5/9/2026 salieron las stories duplicadas: dos corridas del cron
# arrancaron casi juntas (GitHub soltó la cola tardísimo, las marcas quedaron
# 14:05:31Z y 14:14:50Z contra crons de 11:08-12:43 UTC), las dos leyeron el
# directorio sin la marca del día —que se escribe recién al final, después de
# los ~10 minutos que tarda el posteo— y las dos publicaron.
#
#   1. `concurrency` (abajo): dos corridas de este workflow no se ejecutan al
#      mismo tiempo. La segunda espera, y cuando arranca ya ve la marca.
#   2. El lock atómico en el tag `ig-posted/<fecha>/<modo>`: se toma JUSTO antes
#      de postear. Crear un ref es atómico del lado de GitHub y cada corrida
#      empuja un objeto distinto, así que si dos empujan, GitHub acepta uno solo
#      y el otro se va sin postear. Es el candado que hubiera evitado el 5/9.
#   3. El chequeo contra la Graph API adentro de post_to_instagram.py: antes de
#      publicar pregunta si la cuenta ya tiene las stories del día. Es el único
#      que sigue valiendo si el repo miente (marca borrada, corrida a mano
#      desde otra máquina, --force de más).
#
# Los tres fallan cerrado: ante la duda NO se postea. Que un día falte la
# story se ve mucho menos que verla dos veces.

on:
  schedule:
    # 11:08 UTC = 08:08 en Buenos Aires (UTC-3 todo el año, no hay horario de
    # verano). El minuto es feo a propósito: GitHub encola los workflows que
    # caen en punto y a la media, y ahí es donde se acumulan las demoras.
    #
    # Son cuatro horarios y no uno porque el scheduler de GitHub no es puntual
    # ni confiable: no es que llegue unos minutos tarde, es que a veces llega
    # horas tarde o no llega. El 4/9/2026 el cron de las 11:08 no había
    # disparado a las 14:15, y el de scrape.yml —puesto a las 06:47— arrancó
    # 12:09. Con varios intentos, el primero que efectivamente corra publica y
    # los demás se van en 20 segundos al ver la marca del día. La marca es lo
    # que hace que esto sea seguro: sin ella, cuatro crons serían cuatro
    # posteos.
    - cron: '8 11 * * *'
    - cron: '38 11 * * *'
    - cron: '13 12 * * *'
    - cron: '43 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha YYYY-MM-DD (vacío = hoy Buenos Aires)'
        required: false
        default: ''
      mode:
        description: 'Qué postear'
        type: choice
        options:
          - stories-only
          - both
          - feed-only
        default: stories-only
      dry_run:
        description: 'Dry run (no postea, solo loguea)'
        type: boolean
        default: false
      force:
        description: 'Ignorar la marca del día y el lock (igual chequea Instagram)'
        type: boolean
        default: false
      duplicar:
        description: '⚠️ Postear aunque Instagram YA tenga lo del día (duplica)'
        type: boolean
        default: false

# Dos corridas del posteo NUNCA corren a la vez. cancel-in-progress: false
# porque cancelar sería peor: mataría a la que está publicando por la mitad.
# La que llega segunda espera, y al arrancar ya ve la marca del día.
concurrency:
  group: post-ig-${{ github.event.inputs.date || 'hoy' }}-${{ github.event.inputs.mode || 'stories-only' }}
  cancel-in-progress: false

permissions:
  contents: write   # commitea las slides que regenera y el tag del lock

jobs:
  post:
    runs-on: ubuntu-latest
    # 45 y no 30: un día de 20 slides son ~20 esperas de hasta 75s más lo que
    # tarda cada container, y si el job se corta a la mitad el día queda
    # posteado por la mitad — el lock (bien) no lo deja reintentar.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve date
        id: date
        run: |
          if [ -z "${{ inputs.date }}" ]; then
            d="$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"
          else
            d="${{ inputs.date }}"
          fi
          hoy="$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"
          echo "value=$d" >> "$GITHUB_OUTPUT"
          echo "es_hoy=$([ "$d" = "$hoy" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "📅 fecha: $d (hoy en Buenos Aires: $hoy)"

      - name: Build mode flags
        id: flags
        run: |
          # En la corrida programada no hay inputs: el posteo diario son las
          # stories. El carousel del feed queda desactivado.
          mode="${{ inputs.mode }}"
          [ -z "$mode" ] && mode="stories-only"
          case "$mode" in
            feed-only)    echo "flag=--feed-only"    >> "$GITHUB_OUTPUT" ;;
            stories-only) echo "flag=--stories-only" >> "$GITHUB_OUTPUT" ;;
            *)            echo "flag="               >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry="          >> "$GITHUB_OUTPUT"
          fi
          # --force del script saltea el chequeo contra Instagram. Va aparte de
          # `force` a propósito: `force` es "ignorá lo que dice el repo",
          # `duplicar` es "ignorá lo que dice Instagram", que es la única forma
          # de postear dos veces el mismo día. No se activa sin querer.
          if [ "${{ inputs.duplicar }}" = "true" ]; then
            echo "dup=--force" >> "$GITHUB_OUTPUT"
            echo "::warning::duplicar=true — se postea aunque IG ya tenga lo del día"
          else
            echo "dup=" >> "$GITHUB_OUTPUT"
          fi
          # La marca del día se nombra con el modo, así un feed-only manual no
          # queda bloqueado por el stories-only del posteo diario.
          echo "modo=$mode" >> "$GITHUB_OUTPUT"
          echo "modo: $mode"

      - name: ¿Ya se posteó hoy?
        id: marca
        run: |
          d="${{ steps.date.outputs.value }}"
          marca="posts/$d/.posteado-${{ steps.flags.outputs.modo }}"
          if [ -f "$marca" ] && [ "${{ inputs.force }}" != "true" ] \
             && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "⏭  ya se posteó $d en modo ${{ steps.flags.outputs.modo }} " \
                 "($(cat "$marca")). No se postea de nuevo."
            echo "saltear=true" >> "$GITHUB_OUTPUT"
          else
            echo "saltear=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ¿Hay que regenerar las slides?
        id: slides
        if: steps.marca.outputs.saltear != 'true'
        run: |
          d="${{ steps.date.outputs.value }}"
          dir="posts/$d/story"
          motivo=""

          if ! ls "$dir"/slide-*.png >/dev/null 2>&1; then
            motivo="no hay slides para $d"
          else
            # Slides más viejas que la cartelera = se estaría posteando
            # programación desactualizada. Pasó el 14/8/2026: se repostearon
            # stories con las funciones duplicadas de Cosmos aunque los datos
            # ya estaban corregidos.
            nuevo=$(git log -1 --format=%ct -- data/cartelera.json)
            slides=$(git log -1 --format=%ct -- "posts/$d/")
            if [ -n "$nuevo" ] && [ -n "$slides" ] && [ "$slides" -lt "$nuevo" ]; then
              motivo="las slides de $d son más viejas que data/cartelera.json"
            fi
          fi

          # Sólo se regenera la fecha de HOY. Para una fecha pasada la cartelera
          # ya no tiene sus funciones, así que regenerar daría slides vacías en
          # vez del posteo que se quiso repetir.
          if [ -n "$motivo" ] && [ "${{ steps.date.outputs.es_hoy }}" != "true" ]; then
            echo "❌ $motivo, y no es hoy: no hay de dónde reconstruirlas."
            exit 1
          fi

          if [ -n "$motivo" ]; then
            echo "♻️  $motivo → se regeneran desde la cartelera actual"
            echo "regenerar=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ slides de $d listas"
            ls "$dir"/slide-*.png | head -3
            echo "regenerar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.marca.outputs.saltear != 'true' && steps.slides.outputs.regenerar == 'true'
        timeout-minutes: 10
        # Mismo patrón que scrape.yml: apt se cuelga adentro de
        # `playwright install --with-deps` y sin esto se come el job entero.
        run: |
          pip install -r requirements.txt
          for i in 1 2 3; do
            if timeout 300 playwright install --with-deps chromium; then break; fi
            echo "::warning::playwright install falló (intento $i/3)"
            sleep 15
          done

      - name: Generate Instagram stories
        if: steps.marca.outputs.saltear != 'true' && steps.slides.outputs.regenerar == 'true'
        run: |
          python3 scripts/generate_posts.py \
            --date "${{ steps.date.outputs.value }}" --format story

      - name: Commit slides
        if: steps.marca.outputs.saltear != 'true' && steps.slides.outputs.regenerar == 'true' && inputs.dry_run != true
        # Instagram descarga las PNG por URL pública: si no están pusheadas a
        # main, raw.githubusercontent devuelve 404 y el posteo falla.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "posts/${{ steps.date.outputs.value }}/"
          if git diff --cached --quiet; then
            echo "Nada que commitear"
            exit 0
          fi
          git commit -m "posts: stories de ${{ steps.date.outputs.value }} regeneradas antes de postear"
          git pull --rebase -X theirs origin main
          git push origin main
          # raw.githubusercontent tarda en indexar el commit nuevo.
          sleep 20

      - name: ¿Están los secrets?
        # Antes de tomar el lock: si falta el token, el día se tiene que poder
        # reintentar, y un fallo con el lock tomado no se reintenta.
        if: steps.marca.outputs.saltear != 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && { [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; }; then
            echo "❌ Faltan secrets IG_USER_ID / IG_ACCESS_TOKEN"
            exit 1
          fi

      - name: Tomar el lock del día
        id: lock
        if: steps.marca.outputs.saltear != 'true' && inputs.dry_run != true
        run: |
          d="${{ steps.date.outputs.value }}"
          modo="${{ steps.flags.outputs.modo }}"
          ref="refs/tags/ig-posted/$d/$modo"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # commit-tree arma un objeto suelto sin tocar HEAD ni el índice (si
          # commiteáramos en la rama, el commit se colaría en el push a main de
          # más abajo). El mensaje lleva el run id, así que dos corridas nunca
          # generan el mismo sha: la segunda no puede ganar el push de casualidad
          # —GitHub lo rechaza porque el tag ya existe apuntando a otro objeto—.
          # Crear un ref es atómico del lado del servidor: esto es el mutex.
          claim=$(git commit-tree 'HEAD^{tree}' -p HEAD \
                  -m "ig lock $d $modo — run ${{ github.run_id }}.${{ github.run_attempt }}") || {
            echo "::error::no pude armar el objeto del lock (git commit-tree)"
            exit 1
          }

          if [ "${{ inputs.force }}" = "true" ]; then
            git push -f origin "$claim:$ref"
            echo "🔓 force: tomo el lock igual ($ref)"
            echo "saltear=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git push origin "$claim:$ref"; then
            echo "🔒 lock tomado: $ref"
            echo "saltear=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # No se pudo crear el ref. Si ya existe, otra corrida está posteando
          # este día (o lo posteó y falló después): nos vamos sin tocar
          # Instagram. Si no existe, fue un error de red — también nos vamos,
          # que es fallar cerrado, y el próximo cron encuentra el lock libre.
          if [ -n "$(git ls-remote origin "$ref")" ]; then
            echo "⏭  el lock de $d/$modo ya lo tiene otra corrida — no posteo."
          else
            echo "::warning::no pude tomar el lock y el tag no existe (¿red?) — no posteo por las dudas."
          fi
          echo "saltear=true" >> "$GITHUB_OUTPUT"

      - name: Post to Instagram
        id: post
        if: steps.marca.outputs.saltear != 'true' && steps.lock.outputs.saltear != 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main"
        run: |
          # El paso no falla acá: el código de salida decide qué pasa con el
          # lock y con la marca, y recién al final se marca el job en rojo.
          set +e
          python3 scripts/post_to_instagram.py \
            --date "${{ steps.date.outputs.value }}" \
            ${{ steps.flags.outputs.flag }} \
            ${{ steps.flags.outputs.dry }} \
            ${{ steps.flags.outputs.dup }}
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "✅ el día quedó posteado" ;;
            3) echo "::warning::no se publicó nada — suelto el lock y que reintente el próximo cron" ;;
            *) echo "::error::falló DESPUÉS de publicar algo — el lock queda tomado a propósito, reintentar duplicaría" ;;
          esac

      - name: Soltar el lock si no se publicó nada
        # Sólo con rc=3, que es el script diciendo "no salió NADA a Instagram".
        # Con cualquier otro fallo el lock se queda tomado: es la diferencia
        # entre reintentar y duplicar.
        if: always() && steps.lock.outputs.saltear == 'false' && steps.post.outputs.rc == '3'
        run: |
          git push origin ":${{ steps.lock.outputs.ref }}"
          echo "🔓 lock soltado: ${{ steps.lock.outputs.ref }}"

      - name: Dejar la marca del día
        if: steps.marca.outputs.saltear != 'true' && inputs.dry_run != true && steps.post.outputs.rc == '0'
        # Va DESPUÉS de postear y sólo si el posteo salió bien (rc=0). Si no se
        # publicó nada (rc=3) el día queda sin marcar y sin lock, y lo reintenta
        # el cron siguiente: para eso están los cuatro horarios. Si falló con
        # algo ya publicado (rc=1) tampoco se marca, pero el lock queda tomado
        # y nadie reintenta solo — reintentar ahí sería duplicar.
        run: |
          d="${{ steps.date.outputs.value }}"
          marca="posts/$d/.posteado-${{ steps.flags.outputs.modo }}"
          mkdir -p "posts/$d"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$marca"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$marca"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "posts: $d posteado a Instagram (${{ steps.flags.outputs.modo }})"
          git pull --rebase -X theirs origin main
          git push origin main

      - name: Fallar si el posteo no salió bien
        if: always() && steps.post.outputs.rc != '' && steps.post.outputs.rc != '0'
        run: |
          echo "el posteo terminó con código ${{ steps.post.outputs.rc }}"
          exit 1
