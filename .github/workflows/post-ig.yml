name: Post to Instagram

# El posteo diario a Instagram: UNA vez por día, a la mañana.
#
# Vivía adentro de scrape.yml, y ahí la hora del posteo era "cuando el cron
# arranque + lo que tarde el scraper" — entre 20 y 42 minutos según el día.
# Peor: los workflows programados de GitHub arrancan tarde cuando hay cola, y
# no un poco. Con el cron puesto a las 07:15 UTC, el 27/8/2026 la corrida
# arrancó 18:18 y el 31/8 a las 15:08. Las stories salían a cualquier hora.
#
# Separado, la hora del posteo depende del cron y de dos minutos de job, no del
# scraper: el scrape corre de madrugada y deja las PNG commiteadas, y esto sale
# a las 8 de la mañana a publicarlas. Si el scrape se atrasó tanto que todavía
# no hay slides de hoy —o quedaron viejas frente a la cartelera—, este workflow
# las genera él mismo antes de postear, así un scheduler con cola no se lleva
# puesto el posteo del día.
#
# Es el ÚNICO lugar que postea a Instagram. Si volvés a agregar el paso en
# scrape.yml, se postea dos veces por día.

on:
  schedule:
    # 11:08 UTC = 08:08 en Buenos Aires (UTC-3 todo el año, no hay horario de
    # verano). El minuto es feo a propósito: GitHub encola los workflows que
    # caen en punto y a la media, y ahí es donde se acumulan las demoras.
    #
    # Son cuatro horarios y no uno porque el scheduler de GitHub no es puntual
    # ni confiable: no es que llegue unos minutos tarde, es que a veces llega
    # horas tarde o no llega. El 4/9/2026 el cron de las 11:08 no había
    # disparado a las 14:15, y el de scrape.yml —puesto a las 06:47— arrancó
    # 12:09. Con varios intentos, el primero que efectivamente corra publica y
    # los demás se van en 20 segundos al ver la marca del día. La marca es lo
    # que hace que esto sea seguro: sin ella, cuatro crons serían cuatro
    # posteos.
    - cron: '8 11 * * *'
    - cron: '38 11 * * *'
    - cron: '13 12 * * *'
    - cron: '43 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha YYYY-MM-DD (vacío = hoy Buenos Aires)'
        required: false
        default: ''
      mode:
        description: 'Qué postear'
        type: choice
        options:
          - stories-only
          - both
          - feed-only
        default: stories-only
      dry_run:
        description: 'Dry run (no postea, solo loguea)'
        type: boolean
        default: false
      force:
        description: 'Postear aunque ya se haya posteado hoy'
        type: boolean
        default: false

permissions:
  contents: write   # puede tener que commitear las slides que regenera

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve date
        id: date
        run: |
          if [ -z "${{ inputs.date }}" ]; then
            d="$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"
          else
            d="${{ inputs.date }}"
          fi
          hoy="$(TZ='America/Argentina/Buenos_Aires' date +%Y-%m-%d)"
          echo "value=$d" >> "$GITHUB_OUTPUT"
          echo "es_hoy=$([ "$d" = "$hoy" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "📅 fecha: $d (hoy en Buenos Aires: $hoy)"

      - name: Build mode flags
        id: flags
        run: |
          # En la corrida programada no hay inputs: el posteo diario son las
          # stories. El carousel del feed queda desactivado.
          mode="${{ inputs.mode }}"
          [ -z "$mode" ] && mode="stories-only"
          case "$mode" in
            feed-only)    echo "flag=--feed-only"    >> "$GITHUB_OUTPUT" ;;
            stories-only) echo "flag=--stories-only" >> "$GITHUB_OUTPUT" ;;
            *)            echo "flag="               >> "$GITHUB_OUTPUT" ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry=--dry-run" >> "$GITHUB_OUTPUT"
          else
            echo "dry="          >> "$GITHUB_OUTPUT"
          fi
          # La marca del día se nombra con el modo, así un feed-only manual no
          # queda bloqueado por el stories-only del posteo diario.
          echo "modo=$mode" >> "$GITHUB_OUTPUT"
          echo "modo: $mode"

      - name: ¿Ya se posteó hoy?
        id: marca
        run: |
          d="${{ steps.date.outputs.value }}"
          marca="posts/$d/.posteado-${{ steps.flags.outputs.modo }}"
          if [ -f "$marca" ] && [ "${{ inputs.force }}" != "true" ] \
             && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "⏭  ya se posteó $d en modo ${{ steps.flags.outputs.modo }} " \
                 "($(cat "$marca")). No se postea de nuevo."
            echo "saltear=true" >> "$GITHUB_OUTPUT"
          else
            echo "saltear=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ¿Hay que regenerar las slides?
        id: slides
        if: steps.marca.outputs.saltear != 'true'
        run: |
          d="${{ steps.date.outputs.value }}"
          dir="posts/$d/story"
          motivo=""

          if ! ls "$dir"/slide-*.png >/dev/null 2>&1; then
            motivo="no hay slides para $d"
          else
            # Slides más viejas que la cartelera = se estaría posteando
            # programación desactualizada. Pasó el 14/8/2026: se repostearon
            # stories con las funciones duplicadas de Cosmos aunque los datos
            # ya estaban corregidos.
            nuevo=$(git log -1 --format=%ct -- data/cartelera.json)
            slides=$(git log -1 --format=%ct -- "posts/$d/")
            if [ -n "$nuevo" ] && [ -n "$slides" ] && [ "$slides" -lt "$nuevo" ]; then
              motivo="las slides de $d son más viejas que data/cartelera.json"
            fi
          fi

          # Sólo se regenera la fecha de HOY. Para una fecha pasada la cartelera
          # ya no tiene sus funciones, así que regenerar daría slides vacías en
          # vez del posteo que se quiso repetir.
          if [ -n "$motivo" ] && [ "${{ steps.date.outputs.es_hoy }}" != "true" ]; then
            echo "❌ $motivo, y no es hoy: no hay de dónde reconstruirlas."
            exit 1
          fi

          if [ -n "$motivo" ]; then
            echo "♻️  $motivo → se regeneran desde la cartelera actual"
            echo "regenerar=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ slides de $d listas"
            ls "$dir"/slide-*.png | head -3
            echo "regenerar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: steps.marca.outputs.saltear != 'true' && steps.slides.outputs.regenerar == 'true'
        timeout-minutes: 10
        # Mismo patrón que scrape.yml: apt se cuelga adentro de
        # `playwright install --with-deps` y sin esto se come el job entero.
        run: |
          pip install -r requirements.txt
          for i in 1 2 3; do
            if timeout 300 playwright install --with-deps chromium; then break; fi
            echo "::warning::playwright install falló (intento $i/3)"
            sleep 15
          done

      - name: Generate Instagram stories
        if: steps.marca.outputs.saltear != 'true' && steps.slides.outputs.regenerar == 'true'
        run: |
          python3 scripts/generate_posts.py \
            --date "${{ steps.date.outputs.value }}" --format story

      - name: Commit slides
        if: steps.marca.outputs.saltear != 'true' && steps.slides.outputs.regenerar == 'true' && inputs.dry_run != true
        # Instagram descarga las PNG por URL pública: si no están pusheadas a
        # main, raw.githubusercontent devuelve 404 y el posteo falla.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "posts/${{ steps.date.outputs.value }}/"
          if git diff --cached --quiet; then
            echo "Nada que commitear"
            exit 0
          fi
          git commit -m "posts: stories de ${{ steps.date.outputs.value }} regeneradas antes de postear"
          git pull --rebase -X theirs origin main
          git push origin main
          # raw.githubusercontent tarda en indexar el commit nuevo.
          sleep 20

      - name: Post to Instagram
        if: steps.marca.outputs.saltear != 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: "https://raw.githubusercontent.com/${{ github.repository }}/main"
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && { [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCESS_TOKEN" ]; }; then
            echo "❌ Faltan secrets IG_USER_ID / IG_ACCESS_TOKEN"
            exit 1
          fi
          python3 scripts/post_to_instagram.py \
            --date "${{ steps.date.outputs.value }}" \
            ${{ steps.flags.outputs.flag }} \
            ${{ steps.flags.outputs.dry }}

      - name: Dejar la marca del día
        if: steps.marca.outputs.saltear != 'true' && inputs.dry_run != true
        # Va DESPUÉS de postear y sólo si el posteo salió bien: si falló, la
        # marca no se escribe y el cron siguiente vuelve a intentar. Es lo que
        # permite tener varios horarios sin postear varias veces.
        run: |
          d="${{ steps.date.outputs.value }}"
          marca="posts/$d/.posteado-${{ steps.flags.outputs.modo }}"
          mkdir -p "posts/$d"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > "$marca"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$marca"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "posts: $d posteado a Instagram (${{ steps.flags.outputs.modo }})"
          git pull --rebase -X theirs origin main
          git push origin main
